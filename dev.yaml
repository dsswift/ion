version: 4

# =============================================================================
# VARIABLES
# =============================================================================
# ion_logs_dir: absolute path to ~/.ion on this machine.
# The v4 compose: volumes list is passed verbatim into the generated compose file;
# docker compose expands $HOME but dev's named-volume detector does not — it
# only recognises bind mounts by a leading / or . prefix. Using an absolute path
# (via a var) satisfies the detector and is portable across dev users who set
# this var to their own home directory path.
vars:
  ion_logs_dir: /Users/josh/.ion
  # Accepts the Microsoft Software License Terms for the Event Hubs emulator
  # image (https://github.com/Azure/azure-event-hubs-emulator-installer/blob/main/EMULATOR_EULA.md).
  # This is the operator's own opt-in local dev profile, never deployed.
  accept_eula: "Y"

# =============================================================================
# SERVICES
# =============================================================================
# Ion local observability stack — 5 containers.
#
# Default config-path mounts (empirically verified via docker inspect):
#   alloy  CMD: run /etc/alloy/config.alloy  → mount there, default CMD works
#   loki   CMD: -config.file=/etc/loki/local-config.yaml → mount there
#   grafana: no CMD, /run.sh entrypoint, env-driven — no command override needed
#   tempo  CMD: None → build/Dockerfile.tempo COPYs config and sets CMD
#
# NOTE: The v4 compose: block has no command/entrypoint field (silently dropped
# by the executor). All config delivery is via volume mounts or image builds.

services:
  alloy:
    tier: docker
    compose:
      image: grafana/alloy:v1.17.1
      ports:
        - "12345:12345"
      volumes:
        # Config at the image's default CMD path — no command override needed.
        - ./docs/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
        # Ion log files tailed by Alloy — ro so Alloy cannot corrupt them.
        # Uses ${var.ion_logs_dir} (absolute path) so dev's named-volume detector
        # correctly treats this as a bind mount (leading / required).
        - ${var.ion_logs_dir}:/ion-logs:ro
        # Named volume at /var/lib/alloy/data — the path the image's built-in CMD
        # already passes as --storage.path (confirmed via docker inspect on
        # grafana/alloy:v1.17.1: CMD=[run, /etc/alloy/config.alloy,
        # --storage.path=/var/lib/alloy/data]). Because the v4 compose: block
        # silently drops any command: field, we CANNOT add --storage.path as a
        # flag override here. We don't need to: the image CMD already specifies it.
        # Mounting a named volume at that exact path is sufficient to persist
        # Alloy tail read-positions across container restarts.
        # (docker-compose.yml uses an explicit command: block to re-specify the
        # flag because docker compose replaces the image CMD in full when any
        # command: is present. Both files land at the same /var/lib/alloy/data path
        # via different but functionally equivalent mechanisms.)
        - alloy-data:/var/lib/alloy/data
      depends_on:
        - loki

  # Bind-mount attribute-cache refresher — durable fix for the macOS tailer wedge.
  # Docker Desktop's virtualized bind mount serves Alloy a stale, size-frozen view
  # of the high-write-rate engine.jsonl; the staleness re-forms within minutes of
  # any one-shot bust (an Alloy restart is only palliative). A directory readdir
  # (ls -1 /ion-logs) — NOT a file read — busts the cache, and the cache is shared
  # at the VM mount layer, so this separate sidecar readdir-ing the same mount keeps
  # Alloy's view fresh without touching Alloy. Loop is baked into the image CMD
  # because the v4 executor drops any command: field. See README.md § Tailer wedge
  # and docs/observability/Dockerfile.mount-refresher for the full root cause + proof.
  mount-refresher:
    tier: docker
    compose:
      build:
        context: ./docs/observability
        dockerfile: Dockerfile.mount-refresher
      # Same bind mount Alloy tails, read-only. The readdir side effect refreshes
      # the shared VM-layer attribute cache that Alloy's stat() reads from.
      volumes:
        - ${var.ion_logs_dir}:/ion-logs:ro
      depends_on:
        - loki

  # Expands v1-v4 telemetry file records and posts standard events to Alloy's
  # Loki Push API. The image owns the reader and frame-decoding mechanics.
  telemetry-forwarder:
    tier: docker
    compose:
      build:
        context: ./engine
        dockerfile: Dockerfile.telemetry-forwarder
      volumes:
        - ${var.ion_logs_dir}:/ion-logs:ro
        - telemetry-forwarder-data:/data
      depends_on:
        - alloy

  loki:
    tier: docker
    compose:
      image: grafana/loki:3.7.3
      ports:
        - "3100:3100"
      volumes:
        # loki CMD is: -config.file=/etc/loki/local-config.yaml
        # Mount our config at that exact path so the default CMD picks it up.
        - ./docs/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
        - loki-data:/loki

  grafana:
    tier: docker
    compose:
      image: grafana/grafana:13.1.0
      ports:
        - "3000:3000"
      environment:
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        - GF_AUTH_DISABLE_LOGIN_FORM=true
      volumes:
        - ./docs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
        - grafana-data:/var/lib/grafana
      depends_on:
        - loki

  tempo:
    tier: docker
    compose:
      # tempo has no default CMD — we build a thin image that COPYs the config
      # and sets CMD explicitly. Context is docs/observability/ so COPY finds
      # tempo-config.yaml and Dockerfile.tempo in that directory.
      build:
        context: ./docs/observability
        dockerfile: Dockerfile.tempo
      ports:
        - "4317:4317"
        - "4318:4318"
      volumes:
        - tempo-data:/var/tempo

  # Local Event Hub emulator — lets conversationEvents.targets: ["eventhub"]
  # be exercised end to end without a real Azure subscription. Speaks AMQP
  # only (no HTTPS ingest), which is why the engine's eventhub target uses
  # the azeventhubs SDK rather than the http target. Needs the azurite
  # sidecar below for its metadata/blob storage. See
  # docs/observability/eventhub-emulator.md for the connection string and
  # conversationEvents config block that points the engine at this.
  eventhub-emulator:
    tier: docker
    compose:
      image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
      ports:
        - "5672:5672" # AMQP
        - "9092:9092" # Kafka-compatible (unused, part of the image's default exposure)
        - "5300:5300" # health check
      volumes:
        - ./docs/observability/eventhub-emulator-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
      environment:
        - BLOB_SERVER=azurite
        - METADATA_SERVER=azurite
        - ACCEPT_EULA=${var.accept_eula}
      depends_on:
        - azurite

  # Storage backend the Event Hubs emulator requires for metadata/blob state.
  azurite:
    tier: docker
    compose:
      image: mcr.microsoft.com/azure-storage/azurite:latest
      ports:
        - "10000:10000"
        - "10001:10001"
        - "10002:10002"

  # ---------------------------------------------------------------------------
  # Conversation pipeline sample (samples/conversation-pipeline) — profile
  # `pipeline`. A self-contained consumer of the conversation.* stream: its
  # own Event Hubs emulator (port 5673, so it runs beside the observability
  # emulator on 5672) with `capture` and `ingest` consumer groups, Azurite,
  # the Cosmos DB emulator, a capture writer standing in for Event Hubs
  # Capture, and an Event Hub-triggered Azure Function writing the Cosmos
  # hot index. The Go commands (seed, transcript, fold) run on the host via
  # `make demo <verb>` and talk to the published ports. See the sample's
  # README.md for the runbook and the Azure mapping.
  pipeline-eventhub:
    tier: docker
    compose:
      image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
      ports:
        - "5673:5672" # AMQP
      volumes:
        - ./samples/conversation-pipeline/eventhub-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
      environment:
        - BLOB_SERVER=pipeline-azurite
        - METADATA_SERVER=pipeline-azurite
        - ACCEPT_EULA=${var.accept_eula}
      depends_on:
        - pipeline-azurite

  # Storage for the pipeline: the emulator's metadata, the capture and
  # archive containers, and the ingest function's checkpoints.
  pipeline-azurite:
    tier: docker
    compose:
      image: mcr.microsoft.com/azure-storage/azurite:latest
      ports:
        - "10100:10000" # blob
        - "10101:10001" # queue
        - "10102:10002" # table
      volumes:
        - pipeline-azurite-data:/data

  # Cosmos DB emulator (Linux, vnext), HTTP gateway so no certificate dance.
  # Data Explorer at http://localhost:1234.
  pipeline-cosmos:
    tier: docker
    compose:
      image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
      ports:
        - "8081:8081" # gateway
        - "1234:1234" # data explorer
      environment:
        - PROTOCOL=http
        - ENABLE_EXPLORER=true
      volumes:
        - pipeline-cosmos-data:/data

  # Stand-in for Event Hubs Capture: reads the hub on the `capture` consumer
  # group and writes Avro files in Capture's layout to the capture container.
  pipeline-capture:
    tier: docker
    compose:
      build:
        context: ./samples/conversation-pipeline
        dockerfile: Dockerfile.capture
      environment:
        - EVENTHUB_CONNECTION_STRING=Endpoint=sb://pipeline-eventhub;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
        - EVENTHUB_NAME=conversation-events
        - EVENTHUB_NAMESPACE=emulatorns1
        - CAPTURE_CONSUMER_GROUP=capture
        - CAPTURE_CONTAINER=capture
        - CAPTURE_WINDOW_SECONDS=20
        - BLOB_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://pipeline-azurite:10000/devstoreaccount1;
      depends_on:
        - pipeline-eventhub
        - pipeline-azurite

  # The ingest function in the official Functions host image (amd64 only
  # upstream; the Dockerfile pins the platform). Reads the hub on the
  # `ingest` consumer group and upserts one Cosmos document per message.
  # http://localhost:7071/ answers 200 once the host is up.
  pipeline-ingest:
    tier: docker
    compose:
      build:
        context: ./samples/conversation-pipeline
        dockerfile: Dockerfile.function
      platform: linux/amd64
      ports:
        - "7071:80"
      environment:
        - FUNCTIONS_WORKER_RUNTIME=node
        - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://pipeline-azurite:10000/devstoreaccount1;QueueEndpoint=http://pipeline-azurite:10001/devstoreaccount1;TableEndpoint=http://pipeline-azurite:10002/devstoreaccount1;
        - EventHubConnection=Endpoint=sb://pipeline-eventhub;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
        - EVENTHUB_NAME=conversation-events
        - EVENTHUB_CONSUMER_GROUP=ingest
        - COSMOS_ENDPOINT=http://pipeline-cosmos:8081/
        - COSMOS_KEY=C2y6yHQvUrCCxVMhcVoGjHAyB6C5yKl4OO3JJDIdjKxOP4BhQvpxiDyuYyMK9+gXCcrjKa5vXczV14MK1pIZ3g==
        - COSMOS_DATABASE=conversations
        - COSMOS_CONTAINER=events
        - HOT_TTL_SECONDS=604800
      depends_on:
        - pipeline-eventhub
        - pipeline-azurite
        - pipeline-cosmos

# =============================================================================
# GRAPH
# =============================================================================
# Log-flow: engine/desktop/ios JSONL -> alloy -> loki -> grafana
#           telemetry JSONL -> telemetry-forwarder -> alloy API
#           tempo <- otlp (from alloy)

graph:
  host:
    - name: engine-logs
      label: "engine.jsonl"
    - name: desktop-logs
      label: "desktop.jsonl"
    - name: ios-logs
      label: "ios-diagnostic-logs.jsonl"
  edges:
    - from: engine-logs
      to: alloy
      label: "tail (ro)"
    - from: desktop-logs
      to: alloy
      label: "tail (ro)"
    - from: ios-logs
      to: alloy
      label: "tail (ro)"
    - from: telemetry-forwarder
      to: alloy
      label: "Loki API"
    - from: alloy
      to: mount-refresher
      label: "shares mount cache"
    - from: alloy
      to: loki
      label: "push"
    - from: alloy
      to: tempo
      label: "OTLP traces"
    - from: loki
      to: grafana
      label: "query"
    - from: tempo
      to: grafana
      label: "query"
  groups:
    collectors:
      label: "Collectors"
      services: [alloy, telemetry-forwarder, mount-refresher]
    storage:
      label: "Storage"
      services: [loki, tempo]
    visualization:
      label: "Visualization"
      services: [grafana]
    eventhub:
      label: "Event Hub Emulator"
      services: [eventhub-emulator, azurite]
    pipeline:
      label: "Conversation Pipeline Sample"
      services: [pipeline-eventhub, pipeline-azurite, pipeline-cosmos, pipeline-capture, pipeline-ingest]

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================

config:
  default_profile: observability
  compose_project: ion-obs

# =============================================================================
# PROFILES
# =============================================================================

profiles:
  observability:
    description: "Local observability stack: Alloy, Loki, Grafana, Tempo, Event Hub emulator"
    services:
      alloy:
        tier: docker
      mount-refresher:
        tier: docker
      telemetry-forwarder:
        tier: docker
      loki:
        tier: docker
      grafana:
        tier: docker
      tempo:
        tier: docker
      eventhub-emulator:
        tier: docker
      azurite:
        tier: docker

  pipeline:
    description: "Conversation pipeline sample: Event Hubs emulator, Azurite, Cosmos DB emulator, capture writer, ingest function"
    # Its own compose project, so deploying it never treats the observability
    # profile's containers as orphans, and both stacks run side by side.
    # Containers are named ion-demo-<service>.
    compose_project: ion-demo
    services:
      pipeline-eventhub:
        tier: docker
      pipeline-azurite:
        tier: docker
      pipeline-cosmos:
        tier: docker
      pipeline-capture:
        tier: docker
      pipeline-ingest:
        tier: docker

# =============================================================================
# UTILITIES
# =============================================================================

utilities:
  observability-status:
    command: |
      SIDECAR=~/.ion/telemetry.schema.json
      # Read highestSchemaSeen (new key); fall back to schemaVersion (legacy key from rotate-on-mismatch era).
      SIDECAR_VER=$([ -f "$SIDECAR" ] && python3 -c "import json,sys; d=json.load(open('$SIDECAR')); print(d.get('highestSchemaSeen') or d.get('schemaVersion', 1))" 2>/dev/null || echo "absent (-> 1)")
      echo "telemetry sidecar highestSchemaSeen: ${SIDECAR_VER}"
      echo "(schema gate removed: files are append-only; Loki reindex is never auto-triggered)"
    description: "Show the telemetry schema high-water mark from the sidecar"

  clear-logs:
    command: |
      : > ~/.ion/engine.jsonl && \
      : > ~/.ion/desktop.jsonl && \
      : > ~/.ion/telemetry.jsonl && \
      : > ~/.ion/ios-diagnostic-logs.jsonl && \
      rm -f ~/.ion/engine.jsonl.[1-9] \
             ~/.ion/desktop.jsonl.[1-9] \
             ~/.ion/ios-diagnostic-logs.jsonl.[1-9] \
             ~/.ion/telemetry.jsonl.[1-9] && \
      echo "Log files cleared:" && \
      echo "  Cleared live files:     engine.jsonl, desktop.jsonl, telemetry.jsonl, ios-diagnostic-logs.jsonl" && \
      echo "  Removed archives:       *.jsonl.1 through *.jsonl.9"
    description: "Clear live logs and remove .1 through .9 archives"

  clear-observability-data:
    command: |
      echo "Clearing Loki and Alloy state (docker compose -p ion-obs down -v)."
      echo ""
      echo "Will re-ingest on next observability-profile deploy:"
      echo "  ~/.ion/engine.jsonl              (engine + extension logs)"
      echo "  ~/.ion/desktop.jsonl             (desktop logs)"
      echo "  ~/.ion/ios-diagnostic-logs.jsonl (iOS client logs)"
      echo "  ~/.ion/telemetry.jsonl           (telemetry events, if present)"
      echo ""
      echo "Will NOT re-ingest (outside Alloy's targets):"
      echo "  rotated .1 archives (not re-ingested automatically)"
      echo "  anything already truncated by clear-logs (content is gone)"
      echo ""
      docker compose -p ion-obs down -v
      echo ""
      echo "Observability state cleared. Data will re-ingest from the live ~/.ion JSONL files the next time the observability profile is deployed."
    description: "Wipe Loki and Alloy named volumes so data re-ingests from scratch on next observability-profile deploy"

# =============================================================================
# DEPENDENCIES
# =============================================================================

dependencies:
  global:
    - name: "Docker"
      check: "docker info"
      setup: "Install Docker Desktop from docker.com"
