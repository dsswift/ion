# Ion anomaly alert rules — local Loki stack.
#
# 2026-09-28 operator direction: anomalies (a cost or usage spike outside
# norms, a runaway agent left running overnight) become alert rules with
# notifications, and the overview dashboard surfaces the firing count/stream
# via Grafana's native alertlist panel (see dashboards/src/dashboards/overview.ts,
# panel "Critical alerts firing") instead of an operator having to notice a
# raw number drift on some other panel.
#
# Every query here reuses a query SHAPE already proven in the dashboard
# recipes (docs/observability/dashboards/src/queries-logs.ts's
# ingestFreshnessMinutes, queries-fleet.ts's hostLastSeenMinutes: the
# vector(${__to:date:seconds}) / label_format / unwrap detector idiom) rather
# than inventing new LogQL; every query has been run against this stack's real
# data (see the reliability journal entry for 2026-09-28).
#
# 2026-09-28 revision: the first cut of the runaway-session and ingest-wedge
# rules turned out to alert on normal telemetry, not anomalies (session log
# span always covers most of a day; a 30m gap is routine for idle instances).
# The unattended-session rule was rebuilt against real data plus a synthetic
# push to Loki proving the positive case: it keys on run.execute density per
# hourly bucket joined against the command.dispatch span of a send_prompt
# command (the engine's record of a client submitting a prompt — see
# docs/observability/log-schema.md "Spans").
#
# The ion-performance group reads the span metrics Tempo's metrics-generator
# writes to Prometheus (tempo-config.yaml; the Ion Performance dashboard's
# panels are the same queries) and the System Metrics sample lines in Loki.
# A Prometheus query model states its evaluation as instant/range booleans,
# as Grafana's Prometheus datasource does; a Loki query states queryType.
#
# No notification contact point is configured. az-lz-platform has no Grafana
# contact point today (investigated 2026-09-28: no grafana_contact_point /
# grafana_notification_policy resource anywhere in that repo, and the one
# azurerm_monitor_action_group in the repo is scoped to the AI Gateway, not
# reusable here without misattributing Ion alerts to that service). These
# rules fire and are visible in Alerting > Alert rules and on this dashboard's
# alertlist panel either way — Grafana's default notification policy just has
# nowhere to send a message until the operator names a destination (see
# reliability journal 2026-09-28 for the decision this needs).
apiVersion: 1

groups:
  - orgId: 1
    name: ion-anomalies
    folder: Ion Alerts
    interval: 5m
    rules:
      - uid: ion-error-burst
        title: Ion error burst
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({level="ERROR"}[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, ion: 'true' }
        annotations:
          summary: 'More than 20 ERROR log lines in the last 15 minutes.'
          description: 'Threshold matches the overview "Errors" tile''s red band (>=10 over the picker range) with headroom for a short burst; a sustained 15m rate this high is worth paging on. See Ion Errors & Health for the breakdown by component.'

      - uid: ion-cost-spike
        title: Ion cost spike vs 7-day baseline
        condition: D
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: sum(sum_over_time({event_name="run.complete"} | json | unwrap payload_run_cost_usd [1h]))
          - refId: B
            relativeTimeRange: { from: 604800, to: 0 }
            datasourceUid: loki
            model:
              refId: B
              queryType: instant
              expr: sum(sum_over_time({event_name="run.complete"} | json | unwrap payload_run_cost_usd [7d])) / 168
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > (5 * $B) && $A > 1'
          - refId: D
            datasourceUid: __expr__
            model:
              refId: D
              type: threshold
              expression: C
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: critical, ion: 'true' }
        annotations:
          summary: 'The last hour''s spend is more than 5x the trailing 7-day hourly average, and above $1.'
          description: 'A = current-hour spend. B = 7-day trailing hourly average. Fires only when the ratio AND the absolute spend both clear the bar, so a jump from $0.001/hr to $0.01/hr does not page anyone. See Ion Cost for the breakdown.'

      - uid: ion-runaway-session
        title: Ion unattended session (continuous runs, no prompt)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 14400, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                (sum by (session_id) (count_over_time({event_name="run.execute"} | json |
                label_format session_id=context_session_id [1h]))
                and sum by (session_id) (count_over_time({event_name="run.execute"} | json |
                label_format session_id=context_session_id [1h] offset 1h))
                and sum by (session_id) (count_over_time({event_name="run.execute"} | json |
                label_format session_id=context_session_id [1h] offset 2h))
                and sum by (session_id) (count_over_time({event_name="run.execute"} | json |
                label_format session_id=context_session_id [1h] offset 3h)))
                unless on(session_id)
                sum by (session_id) (count_over_time({event_name="command.dispatch"} | json |
                label_format session_id=context_session_id | payload_command="send_prompt" [4h]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, ion: 'true' }
        annotations:
          summary: 'A session has had engine runs executing in every one of the last four consecutive 1h windows, with zero client-submitted prompts (no command.dispatch span for a send_prompt command) anywhere in that 4h stretch — an agent working unattended, e.g. left running overnight.'
          description: 'Not a log-span check (normal sessions legitimately span most of a day) — this keys on run.execute density per hourly bucket, joined against session_id, then excludes any session that has at least one command.dispatch span for a send_prompt command (the engine''s record of a client submitting a prompt) in the same 4h window. A session mid one long user-initiated dispatch chain still has its opening prompt''s command.dispatch inside the window and will not fire; a session with continuous run activity and zero fresh user input for 4+ hours will. See Ion Live Logs / Ion Forensics (filter by the firing session_id) to confirm before killing it.'


  - orgId: 1
    name: ion-performance
    folder: Ion Alerts
    interval: 1m
    rules:
      - uid: ion-run-p95
        title: Ion run p95 over 120 s
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: >-
                histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{span_name="run.execute",
                service="ion-engine"}[10m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [120] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, ion: 'true' }
        annotations:
          summary: 'The engine''s p95 run duration (the run.execute span) has been above 120 seconds for 10 minutes.'
          description: 'Long runs are not wrong by themselves; a sustained shift is. Ion Performance "run.execute p50 / p95 by model" splits it by model and Backend; the LLM call, attempt, and tool panel says where inside the run the time goes.'

      - uid: ion-host-memory-low
        title: Ion host memory available under 10%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                max by (host_name) (last_over_time({service_name="ion-engine", event_name=""} | json | tag="sysmetrics"
                | msg=~"system metrics sample|HIGH MEMORY" | fields_host_memory_available_bytes != ""
                | unwrap fields_host_memory_available_bytes [10m]))
                / max by (host_name) (last_over_time({service_name="ion-engine", event_name=""} | json | tag="sysmetrics"
                | msg=~"system metrics sample|HIGH MEMORY" | fields_host_memory_total_bytes != ""
                | unwrap fields_host_memory_total_bytes [10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: critical, ion: 'true' }
        annotations:
          summary: 'A host has had less than 10% of its physical memory available to new work for 10 minutes.'
          description: 'Available over total, per host_name, from the engine''s System Metrics sample line (fields.host_memory_available_bytes / host_memory_total_bytes); the last sample in each 10 m window. Inside a container the available figure is the limit less its use, so the ratio reads against physical memory the container may not be allowed to use. Ion System Metrics "Memory by engine process role" says which role holds it.'
