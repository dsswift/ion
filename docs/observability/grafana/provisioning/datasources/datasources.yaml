apiVersion: 1

datasources:
  # Metrics: the engine's OTLP System Metrics, stored in Prometheus. The same
  # PromQL runs against an Azure Monitor workspace in a hosted deployment.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 60s
      # Metric -> trace: Tempo's metrics-generator attaches the trace id to
      # each span-metrics histogram sample as an exemplar labeled traceID;
      # an OTel SDK exemplar is labeled trace_id. Either opens in Tempo.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
        - name: trace_id
          datasourceUid: tempo
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Log -> trace: every line that names a trace carries it as the
      # trace_id structured metadata (the OTLP LogRecord traceId), which a
      # label matcher reads without parsing the line.
      derivedFields:
        - datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          name: TraceID
          url: '${__value.raw}'
          urlDisplayLabel: View trace in Tempo
    # Provisioned correlations for Explore deep-linking (Grafana 13.1.0+).
    # Schema: correlations is a list under the source datasource. Each entry:
    #   targetUID: UID of the target datasource (must match a provisioned uid above).
    #   label: short label shown in the Explore link button.
    #   description: tooltip / detail description.
    #   type: "query" for datasource queries; "external" for URL links.
    #   config.target: the query model sent to the target datasource.
    #   config.field: the field whose value drives the variable substitution.
    # Verified against the Grafana correlations provisioning schema used by
    # grafana/grafana:13.1.0 (see grafana/devenv/datasources.yaml and
    # https://grafana.com/docs/grafana/latest/administration/correlations/create-a-new-correlation/).
    correlations:
      # conversation_id → Explore: every operational log line for a conversation.
      #
      # Operational lines carry conversation_id at the TOP level (every
      # surface's logger resolves it per line); telemetry events carry it
      # nested under context. One correlation cannot serve both. An
      # operational line is any stream with no event_name.
      - targetUID: loki
        label: "All logs for conversation"
        description: "Open Explore filtered to every operational log line sharing this conversation_id (engine, server, desktop, web, ios, extensions)."
        type: query
        config:
          target:
            expr: '{service_name=~".+", event_name=""} | json | conversation_id = "${__value.raw}"'
          field: conversation_id

      # The same pivot from a telemetry event, whose ids are nested.
      - targetUID: loki
        label: "All logs for conversation (from telemetry)"
        description: "Open Explore filtered to every operational log line sharing this telemetry event's conversation."
        type: query
        config:
          target:
            expr: '{service_name=~".+", event_name=""} | json | conversation_id = "${__value.raw}"'
          field: context_conversation_id

      # session_id → Explore: all telemetry events for a session.
      - targetUID: loki
        label: "Session telemetry"
        description: "Open Explore filtered to all telemetry events for this session_id (llm.call, run.complete, dispatch.agent, cache.savings)."
        type: query
        config:
          target:
            expr: '{event_name=~".+"} | context_session_id = "${__value.raw}"'
          field: context_session_id

      # trace_id → Tempo: jump from a Loki log line to the corresponding trace.
      - targetUID: tempo
        label: "View trace"
        description: "Open this line's trace in Tempo. Present on every line logged inside a traced operation."
        type: query
        config:
          target:
            query: "${__value.raw}"
          field: trace_id

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Search and TraceQL metrics stream over HTTP; tempo-config.yaml sets
      # stream_over_http_enabled to match.
      streamingEnabled:
        search: true
        metrics: true
      # Trace -> logs: every line and telemetry event whose trace_id
      # structured metadata is this trace, from any service. No json parse.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true
        customQuery: true
        query: '{service_name=~".+"} | trace_id="${__trace.traceId}"'
      # Service Graph tab: reads the traces_service_graph_* series Tempo's
      # metrics-generator remote-writes to Prometheus (tempo-config.yaml).
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
