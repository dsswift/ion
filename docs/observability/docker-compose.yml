services:
  alloy:
    image: grafana/alloy:v1.17.1
    # command: is required here because docker-compose replaces the image CMD
    # entirely. We re-specify --storage.path=/var/lib/alloy/data so Alloy writes
    # read-position state to the alloy-data named volume instead of the binary's
    # relative default (data-alloy/ inside the ephemeral container root).
    # NOTE: grafana/alloy:v1.17.1 image CMD already includes this flag, so this
    # override is consistent with the image default and is not redundant — it is
    # required because any command: block replaces the image CMD in full.
    # dev.yaml uses a different mechanism: it omits command: (dropped by the v4
    # executor) and relies on the image CMD directly; see dev.yaml alloy notes.
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345" # Alloy HTTP UI
      - "4317:4317" # OTLP gRPC in: traces to Tempo, logs dropped (already tailed)
      - "4318:4318" # OTLP HTTP in: same
    volumes:
      # ION_LOGS_DIR points the collector at a data directory other than the
      # default -- a server started with its own ION_DATA_DIR writes there,
      # and its logs are invisible to this stack otherwise.
      - ${ION_LOGS_DIR:-${HOME}/.ion}:/ion-logs:ro
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      # Named volume at the path the image CMD passes as --storage.path.
      # Persists Alloy tail read-positions across container restarts so logs
      # are not re-ingested from the beginning on every stack restart.
      - alloy-data:/var/lib/alloy/data
    networks:
      - ion-obs
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - loki

  # Bind-mount attribute-cache refresher — durable fix for the macOS tailer wedge.
  # Docker Desktop's virtualized bind mount serves Alloy a stale, size-frozen view
  # of the high-write-rate engine.jsonl; the staleness re-forms within minutes of
  # any one-shot bust (an Alloy restart is only palliative). A directory readdir
  # (ls -1 /ion-logs) — NOT a file read — busts the cache, and the cache is shared
  # at the VM mount layer, so this separate sidecar readdir-ing the same mount keeps
  # Alloy's view fresh without touching Alloy. See README.md § Tailer wedge and
  # Dockerfile.mount-refresher for the full root cause + live proof.
  mount-refresher:
    build:
      context: .
      dockerfile: Dockerfile.mount-refresher
    volumes:
      # Same bind mount Alloy tails, read-only. The readdir side effect refreshes
      # the shared VM-layer attribute cache that Alloy's stat() reads from.
      - ${HOME}/.ion:/ion-logs:ro
    networks:
      - ion-obs
    deploy:
      resources:
        limits:
          memory: 32m

  # Expands telemetry file records at any schema at or below its own, and posts
  # standard events to Alloy's Loki Push API, one stream per recording service
  # (service_name). The image owns the reader and frame-decoding mechanics;
  # rebuild it when the forwarder source changes.
  telemetry-forwarder:
    build:
      context: ../../engine
      dockerfile: Dockerfile.telemetry-forwarder
    volumes:
      - ${HOME}/.ion:/ion-logs:ro
      - telemetry-forwarder-data:/data
    networks:
      - ion-obs
    depends_on:
      - alloy

  loki:
    image: grafana/loki:3.7.3
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki.yaml
      - loki-data:/loki
    networks:
      - ion-obs
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:13.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - ion-obs
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      - loki

  # Tempo stores traces. Optional: comment it out if you do not need traces.
  # Keep in step with dev.yaml, which builds the same image and config from
  # Dockerfile.tempo.
  tempo:
    image: grafana/tempo:3.0.3
    command:
      - -config.file=/etc/tempo/tempo.yaml
    # No published OTLP ports: spans come in through Alloy, which owns
    # 4317/4318. Grafana reaches Tempo inside the network on 3200.
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo.yaml
      - tempo-data:/var/tempo
    networks:
      - ion-obs
    deploy:
      resources:
        limits:
          memory: 256m

  # Prometheus is the metrics store, the local stand-in for the Azure Monitor
  # workspace behind Application Insights. It receives the engine's OTLP
  # metrics (telemetry.otel.metrics) directly on its native OTLP receiver:
  #   endpoint: http://localhost:9090/api/v1/otlp/v1/metrics
  # Grafana reads it as the "Prometheus" data source.
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ion-obs
    deploy:
      resources:
        limits:
          memory: 256m

  # Local Event Hub emulator — optional, only needed to exercise
  # conversationEvents.targets: ["eventhub"] without a real Azure subscription.
  # Speaks AMQP only (no HTTPS ingest); needs the azurite sidecar below.
  # See eventhub-emulator.md for the connection string and config block.
  eventhub-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    ports:
      - "5672:5672" # AMQP
      - "9092:9092" # Kafka-compatible (unused, part of the image's default exposure)
      - "5300:5300" # health check
    volumes:
      - ./eventhub-emulator-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    environment:
      - BLOB_SERVER=azurite
      - METADATA_SERVER=azurite
      - ACCEPT_EULA=Y
    networks:
      - ion-obs
    depends_on:
      - azurite

  # Storage backend the Event Hubs emulator requires for metadata/blob state.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - ion-obs

networks:
  ion-obs:
    driver: bridge

volumes:
  alloy-data:
  loki-data:
  grafana-data:
  tempo-data:
  prometheus-data:
  telemetry-forwarder-data:
