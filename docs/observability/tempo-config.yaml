# Tempo 3 single-binary config for the local stack. The same config ships to
# the home-lab cluster (sh-monorepo kubernetes/workloads/ion-observability).
#
# TraceQL metrics ({ } | rate(), Grafana Traces Drilldown) need no extra
# config and no Prometheus: in Tempo 3 the live-store answers metrics queries
# on recent data and the querier reads older blocks from storage. Tempo 3
# removed the metrics-generator local-blocks processor that 2.x needed for
# this, and refuses to start if a config still names it.
#
# Span metrics and the service graph are a different thing: durations become
# distributions here, not in app code. The metrics-generator turns every span
# into a latency histogram and a call counter (traces_spanmetrics_*) and every
# client->server span pair into a service-graph edge (traces_service_graph_*),
# and remote-writes them to Prometheus, which Grafana reads for the Ion
# Performance dashboard, the Performance alerts, and Tempo's Service Graph tab
# (grafana/provisioning/datasources/datasources.yaml serviceMap).

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        # Each histogram sample carries a trace id, so a Performance panel can
        # jump from a p99 point to the trace behind it (exemplarTraceIdDestinations).
        send_exemplars: true
  processor:
    span_metrics:
      # The intrinsic labels are always present: service (resource
      # service.name), span_name, span_kind, status_code. These are the span
      # attributes (or resource attributes) added as labels, each written with
      # dots as underscores. host.name and user are the identity pair every
      # dashboard scopes on; the rest are the dimensions the Performance
      # dashboard splits by (docs/observability/log-schema.md § "Spans").
      dimensions:
        - host.name
        - user
        - backend
        - model
        - transport
        - client_kind
        - action
        - command
        - surface
        - direction
      enable_target_info: true
    service_graphs:
      dimensions:
        - host.name

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

usage_report:
  reporting_enabled: false
