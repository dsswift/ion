version: 2
updates:
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-go-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all-go-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /engine/extensions/sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      all-npm-deps:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all-docker:
        patterns:
          - "*"
