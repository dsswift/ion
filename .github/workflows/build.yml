name: Build

on:
  workflow_call:
    inputs:
      release_report:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_report:
        description: 'Release report JSON (from release-damnit or .act/release-report.json)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-engine:
    if: contains(fromJSON(inputs.release_report).components, 'engine')
    strategy:
      # A compile or signing failure on one platform must not cancel the
      # others. With the default fail-fast, the windows/amd64 job's failure
      # cancelled darwin-arm64, darwin-amd64, and linux-amd64 mid-upload and
      # skipped engine-checksums, so the release published with zero assets
      # while still being marked "latest" — breaking the README install
      # command for every platform, not just the one that failed. Partial
      # assets plus a red job is strictly recoverable; an empty release is not.
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            ext: ""
            runner: macos-14
          - goos: darwin
            goarch: arm64
            ext: ""
            runner: macos-14
          - goos: windows
            goarch: amd64
            ext: ".exe"
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: engine
        run: go test ./...

      - name: Build binary
        working-directory: engine
        env:
          # Darwin needs cgo for the Local Network warmup probe
          # (internal/network/lanwarmup_darwin.go); darwin jobs run on macOS
          # runners so the SDK is native. Other targets stay CGO-free static.
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "${ASSET}" ./cmd/ion/

      - name: Import signing certificate
        if: matrix.goos == 'darwin'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-$(date +%s)"

          echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_FILE"

      - name: Sign binary
        if: matrix.goos == 'darwin'
        working-directory: engine
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing with: $IDENTITY"
          # Namespaced identifier: macOS Local Network grants key to the code
          # identity; keep in sync with engine/commands/install.command and
          # desktop/scripts/afterPack.js.
          codesign --force --sign "$IDENTITY" --identifier house.sprague.ion.engine --options runtime "$ASSET"
          codesign --verify --verbose "$ASSET"

      - name: Notarize binary
        if: matrix.goos == 'darwin'
        working-directory: engine
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          # notarytool requires a zip or pkg.
          ZIP="${ASSET}.zip"
          zip "$ZIP" "$ASSET"

          # Write API key to file
          KEY_FILE=$(mktemp /tmp/apikey.XXXXXX.p8)
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE"

          xcrun notarytool submit "$ZIP" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 10m

          rm -f "$KEY_FILE" "$ZIP"

      - name: Clean up keychain
        if: matrix.goos == 'darwin' && always()
        run: |
          security delete-keychain build.keychain-db 2>/dev/null || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: engine
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          gh release upload "$TAG" "${ASSET}" --clobber

  engine-checksums:
    needs: build-engine
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          gh release download "$TAG" -R "${{ github.repository }}" -D assets/

      - name: Generate checksums
        run: |
          cd assets
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          gh release upload "$TAG" assets/checksums.txt --clobber -R "${{ github.repository }}"

  build-engine-image:
    if: contains(fromJSON(inputs.release_report).components, 'engine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: engine
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/engine:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/engine:latest

  build-relay:
    if: contains(fromJSON(inputs.release_report).components, 'relay')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="relay") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: relay
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/relay:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/relay:latest

  build-desktop:
    if: contains(fromJSON(inputs.release_report).components, 'desktop')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="desktop") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build engine for macOS universal
        working-directory: engine
        env:
          ION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # cgo required for the Local Network warmup probe
          # (internal/network/lanwarmup_darwin.go); this job runs on macOS so
          # cross-arch darwin cgo builds work natively.
          #
          # Stamp main.version so `ion version` reports the shipped release
          # instead of the "dev" default. This is observability, not a
          # correctness gate: the desktop swaps the daemon by binary hash
          # (engine-bootstrap.ts), not by this string. An unstamped binary
          # reports "dev" for every build, which is what made the stale-daemon
          # bug invisible in support logs.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${ION_VERSION}" -o ion-arm64 ./cmd/ion/
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${ION_VERSION}" -o ion-amd64 ./cmd/ion/
          lipo -create -output ion ion-arm64 ion-amd64
          rm ion-arm64 ion-amd64
          file ion

      - name: Copy engine to desktop resources
        run: |
          mkdir -p desktop/resources/engine
          cp engine/ion desktop/resources/engine/ion

      - name: Bundle engine extensions and plist
        run: |
          # Copy the extension SDK into the resources tree so it is packaged
          # as extraResources alongside the engine binary. The plist template is
          # written by engine-bootstrap.ts at first launch after $HOME substitution.
          mkdir -p desktop/resources/engine/extensions
          cp -R engine/extensions/sdk desktop/resources/engine/extensions/sdk
          cp -R sdk/go desktop/resources/engine/extensions/sdk-go

          # Copy plist template; engine-bootstrap.ts substitutes $HOME at runtime.
          cp packaging/launchd/com.ion.engine.plist desktop/resources/engine/com.ion.engine.plist

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set desktop release version
        working-directory: desktop
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build app
        working-directory: desktop
        env:
          ION_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: npx electron-vite build --mode production

      - name: Import signing certificates
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          # Developer ID Application cert — signs the .app.
          APP_CERT_FILE=$(mktemp /tmp/appcert.XXXXXX.p12)
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$APP_CERT_FILE"
          security import "$APP_CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$APP_CERT_FILE"

          # Developer ID Installer cert — signs the .pkg (productsign). This is a
          # DISTINCT cert type from the Application cert above. A release package
          # must never be uploaded without this certificate.
          [ -n "$APPLE_INSTALLER_CERT_BASE64" ] || { echo "ERROR: APPLE_INSTALLER_CERT_BASE64 is required"; exit 1; }
          [ -n "$APPLE_INSTALLER_CERT_PASSWORD" ] || { echo "ERROR: APPLE_INSTALLER_CERT_PASSWORD is required"; exit 1; }
          INST_CERT_FILE=$(mktemp /tmp/instcert.XXXXXX.p12)
          echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > "$INST_CERT_FILE"
          security import "$INST_CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productsign -T /usr/bin/security
          rm -f "$INST_CERT_FILE"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Extract the Application identity for electron-builder (name only) and
          # the Installer identity for productsign (full "Developer ID Installer:"
          # string). find-identity with no policy filter lists both.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/' | sed 's/^Developer ID Application: //')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
          [ -n "$INSTALLER_IDENTITY" ] || { echo "ERROR: imported certificate has no Developer ID Installer identity"; exit 1; }
          echo "APPLE_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package
        working-directory: desktop
        env:
          CI: "true"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-builder --mac --universal --publish never \
            -c.mac.identity="$APPLE_SIGNING_IDENTITY"

      - name: Build, sign, and notarize the enterprise .pkg
        working-directory: desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Wrap the signed + notarized Ion.app into a component .pkg for MDM
          # (Intune/Jamf) push. build-pkg.sh reads the version from package.json
          # and writes release/Ion-<version>.pkg.
          npm run pkg

          PKG=""
          for f in release/Ion-*.pkg; do
            [ -f "$f" ] && PKG="$f" && break
          done
          [ -n "$PKG" ] || { echo "ERROR: no .pkg produced by build-pkg.sh"; exit 1; }

          bash scripts/sign-release-pkg.sh "$PKG"

          APP="release/mac-universal/Ion.app"
          [ -d "$APP" ] || { echo "ERROR: no universal Ion.app produced"; exit 1; }
          node scripts/check-release-version.js "${{ steps.version.outputs.version }}" "$APP" "$PKG"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop
        run: |
          TAG="desktop-v${{ steps.version.outputs.version }}"
          for f in release/*.zip release/*.pkg release/latest-mac.yml; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber -R "${{ github.repository }}"
          done

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain-db 2>/dev/null || true

  # Windows desktop release. Separate job from build-desktop because the NSIS
  # installer, the engine's windows build, and the Intune packaging all need a
  # Windows host — electron-builder can technically cross-build NSIS from macOS
  # via wine, but nothing else here can, and a native runner is also what makes
  # the smoke test below meaningful.
  #
  # Authenticode signing is decided by scripts/ci/resolve-windows-signing.ps1
  # before anything is built. With WINDOWS_CERT_PFX_BASE64 configured the
  # installer is signed and a signing failure fails the job; with
  # ION_REQUIRE_WINDOWS_SIGNING=true and no certificate the job stops rather
  # than publishing an unsigned release; with neither, the build proceeds and
  # every artifact is labelled UNSIGNED in its provenance manifest. There is no
  # path that publishes an unsigned installer while claiming otherwise.
  build-desktop-windows:
    if: contains(fromJSON(inputs.release_report).components, 'desktop')
    strategy:
      # x64 is the supported target. arm64 is a best-effort cross-build that
      # is neither verified nor supported, so its failure must not sink the
      # x64 row.
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Get version
        id: version
        shell: bash
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="desktop") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build engine for Windows
        working-directory: engine
        shell: bash
        env:
          ION_VERSION: ${{ steps.version.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          # No cgo: the Local Network warmup probe is darwin-only, so the
          # windows build is pure Go and cross-arch needs no toolchain.
          # main.version is stamped for the same observability reason as the
          # mac job — an unstamped binary reports "dev" in every support log.
          case "$TARGET_ARCH" in
            x64) GOARCH=amd64 ;;
            arm64) GOARCH=arm64 ;;
            *) echo "unknown arch $TARGET_ARCH"; exit 1 ;;
          esac
          CGO_ENABLED=0 GOOS=windows GOARCH="$GOARCH" \
            go build -ldflags "-s -w -X main.version=${ION_VERSION}" -o ion.exe ./cmd/ion/
          ls -l ion.exe
          # The GUI-subsystem launcher the Scheduled Task runs. -H windowsgui
          # is what keeps a console window off the user's screen; see
          # engine/cmd/ion-engine-host.
          CGO_ENABLED=0 GOOS=windows GOARCH="$GOARCH" \
            go build -ldflags "-s -w -H windowsgui" -o ion-engine-host.exe ./cmd/ion-engine-host/
          ls -l ion-engine-host.exe

      - name: Copy engine and task template to desktop resources
        shell: bash
        run: |
          mkdir -p desktop/resources/engine/extensions
          cp engine/ion.exe desktop/resources/engine/ion.exe
          cp engine/ion-engine-host.exe desktop/resources/engine/ion-engine-host.exe
          cp -R engine/extensions/sdk desktop/resources/engine/extensions/sdk
          cp -R sdk/go desktop/resources/engine/extensions/sdk-go
          # The Scheduled Task template; engine-supervisor-schtasks.ts
          # substitutes the per-user paths at registration time.
          cp packaging/windows/ion-engine-task.xml desktop/resources/engine/ion-engine-task.xml

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set desktop release version
        working-directory: desktop
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build app
        working-directory: desktop
        env:
          ION_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: npx electron-vite build --mode production

      - name: Resolve the Windows signing identity
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ION_REQUIRE_WINDOWS_SIGNING: ${{ vars.ION_REQUIRE_WINDOWS_SIGNING }}
        run: pwsh -File scripts/ci/resolve-windows-signing.ps1

      - name: Build the NSIS installer
        working-directory: desktop
        env:
          CI: "true"
          # The bundled nsis7z plugin cannot decode 7-Zip's ARM64 branch
          # filter, so an unpinned filter yields an ARM64 installer that omits
          # every executable and still exits 0. Get-IonSevenZipFilter in
          # scripts/windows/IonBuild.ps1 carries the same value for local
          # builds and explains it in full.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          # CSC_LINK is empty when no certificate is configured, which is
          # electron-builder's own "do not sign" signal.
          CSC_LINK: ${{ steps.signing.outputs.certificateFile }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        # When CSC_LINK is set, signing is attempted and a failure fails this
        # step. The gate above has already refused the case where signing was
        # required and absent, so there is no path from here to an unsigned
        # release that claims to be signed.
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      - name: Verify the release version
        working-directory: desktop
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          node scripts/check-release-version.js "$V" \
            "release/Ion-Setup-$V-${{ matrix.arch }}.exe" "release/latest.yml"

      - name: Package for Intune and stamp the detection script
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          pwsh -File scripts/ci/make-intunewin.ps1 `
            -InstallerPath "desktop/release/Ion-Setup-${{ steps.version.outputs.version }}-x64.exe" `
            -OutputDir "desktop/release/intune"

      - name: Zip the Group Policy templates
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          cd packaging/windows/policy
          7z a "../../../desktop/release/Ion-PolicyTemplates-$V.zip" IonEngine.admx en-US

      # Provenance for every asset a fleet will install. The manifest reads
      # each file's real SHA-256 and its real Authenticode status off the file
      # rather than from the build's intent, and refuses to call a build from
      # a dirty tree reproducible. Without it, an installer downloaded from a
      # release page cannot be tied to a commit at all.
      - name: Write the artifact provenance manifest
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          pwsh -File scripts/ci/Write-IonArtifactManifest.ps1 `
            -Path @(
              "desktop/release/Ion-Setup-$v-x64.exe",
              "desktop/release/intune/Ion-Setup-$v-x64.intunewin",
              "desktop/release/intune/Detect-Ion.ps1",
              "desktop/release/Ion-PolicyTemplates-$v.zip"
            ) `
            -OutputPath "desktop/release/Ion-Artifacts-$v-x64.json" `
            -Version $v -Arch x64 -BuildType '${{ steps.signing.outputs.buildType }}'

      - name: Intune-shaped smoke test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          pwsh -File scripts/ci/windows-smoke.ps1 `
            -InstallerPath "desktop/release/Ion-Setup-${{ steps.version.outputs.version }}-x64.exe" `
            -DetectScriptPath "desktop/release/intune/Detect-Ion.ps1"

      - name: Upload the installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: desktop
        run: |
          TAG="desktop-v${{ steps.version.outputs.version }}"
          for f in release/*.exe release/*.blockmap; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber -R "${{ github.repository }}"
          done

      # latest.yml, the Intune package and the policy templates come from the
      # x64 row only. Both arch rows write a release/latest.yml listing just
      # their own installer, so uploading both would leave whichever finished
      # last as the update feed for every Windows user. x64 is the supported
      # target, so x64 owns the feed.
      - name: Upload the update feed and management assets
        if: matrix.arch == 'x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: desktop
        run: |
          TAG="desktop-v${{ steps.version.outputs.version }}"
          for f in release/latest.yml release/intune/*.intunewin \
                   release/intune/Detect-Ion.ps1 release/Ion-PolicyTemplates-*.zip \
                   release/Ion-Artifacts-*.json release/Ion-Artifacts-*.sha256; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber -R "${{ github.repository }}"
          done
