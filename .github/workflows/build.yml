name: Build

# Every release named in the report arrives here as a draft (release.yml
# holds it). Each component's ready-* job at the bottom marks the gate commit
# `release/<component>` once every one of that component's assets is
# attached; the `publish` job then runs publish-tested-releases.mjs, which
# makes a draft public only when its build is marked ready and its Quality
# jobs passed. A build failure leaves a draft with a rerun button and never a
# published release with files missing. Tests do not run here: the Quality
# workflow is the test lane and runs beside this one.
#
# Images push only their version tags here. `:latest` moves when the release
# goes public.
#
# A dry run builds and verifies everything a release would from any ref, and
# publishes nothing: no release upload, no image push, no checksums, no
# publish. It is how a release-only failure gets reproduced from a branch.
on:
  workflow_call:
    inputs:
      release_report:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: main
      # The commit whose Quality run gates these releases: the commit each
      # release was cut from. Defaults to the triggering commit.
      gate_sha:
        required: false
        type: string
        default: ''
      dry_run:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_report:
        description: 'Release report JSON (from release-damnit or .act/release-report.json)'
        required: true
        type: string
      ref:
        description: 'Branch, tag, or commit to build'
        required: false
        type: string
        default: main
      gate_sha:
        description: 'Commit whose Quality run gates these releases (default: the triggering commit)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and verify only; publish nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  statuses: write
  actions: write

jobs:
  build-engine:
    if: contains(fromJSON(inputs.release_report).components, 'engine')
    strategy:
      # A compile or signing failure on one platform must not cancel the
      # others. With the default fail-fast, the windows/amd64 job's failure
      # cancelled darwin-arm64, darwin-amd64, and linux-amd64 mid-upload and
      # skipped engine-checksums, so the release published with zero assets
      # while still being marked "latest" — breaking the README install
      # command for every platform, not just the one that failed. Partial
      # assets plus a red job is strictly recoverable; an empty release is not.
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            runner: ubuntu-latest
          # linux/arm64 hosts (ARM servers, the Jarvis cluster) run this one.
          - goos: linux
            goarch: arm64
            ext: ""
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            ext: ""
            runner: macos-14
          - goos: darwin
            goarch: arm64
            ext: ""
            runner: macos-14
          - goos: windows
            goarch: amd64
            ext: ".exe"
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        working-directory: engine
        env:
          # Darwin needs cgo for the Local Network warmup probe
          # (internal/network/lanwarmup_darwin.go) and the FSEvents workspace
          # watcher (internal/watcher/fsevents_darwin.go); darwin jobs run on
          # macOS runners so the SDK is native. Other targets stay CGO-free static.
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "${ASSET}" ./cmd/ion/

      - name: Import signing certificate
        if: matrix.goos == 'darwin'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-$(date +%s)"

          echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_FILE"

      - name: Sign binary
        if: matrix.goos == 'darwin'
        working-directory: engine
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing with: $IDENTITY"
          # Namespaced identifier: macOS Local Network grants key to the code
          # identity; keep in sync with engine/commands/install.command.
          codesign --force --sign "$IDENTITY" --identifier house.sprague.ion.engine --options runtime "$ASSET"
          codesign --verify --verbose "$ASSET"

      - name: Notarize binary
        if: matrix.goos == 'darwin'
        working-directory: engine
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          # notarytool requires a zip or pkg.
          ZIP="${ASSET}.zip"
          zip "$ZIP" "$ASSET"

          # Write API key to file
          KEY_FILE=$(mktemp /tmp/apikey.XXXXXX.p8)
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE"

          xcrun notarytool submit "$ZIP" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 10m

          rm -f "$KEY_FILE" "$ZIP"

      - name: Clean up keychain
        if: matrix.goos == 'darwin' && always()
        run: |
          security delete-keychain build.keychain-db 2>/dev/null || true

      - name: Upload to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: engine
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          gh release upload "$TAG" "${ASSET}" --clobber

  engine-checksums:
    if: ${{ !inputs.dry_run }}
    needs: build-engine
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          # Outside the checkout, so a stray asset can never be committed.
          bash .github/scripts/download-release-assets.sh "${{ github.repository }}" "$TAG" "$RUNNER_TEMP/engine-release"

      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP/engine-release"
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          gh release upload "$TAG" "$RUNNER_TEMP/engine-release/checksums.txt" --clobber -R "${{ github.repository }}"

  build-engine-image:
    if: contains(fromJSON(inputs.release_report).components, 'engine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: engine
          push: ${{ !inputs.dry_run }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/engine:${{ steps.version.outputs.version }}

  ready-engine:
    if: always() && !inputs.dry_run && contains(fromJSON(inputs.release_report).components, 'engine') && needs.build-engine.result == 'success' && needs.engine-checksums.result == 'success' && needs.build-engine-image.result == 'success'
    needs: [build-engine, engine-checksums, build-engine-image]
    runs-on: ubuntu-latest
    steps:
      - name: Mark the engine build ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPORT: ${{ inputs.release_report }}
          GATE_SHA: ${{ inputs.gate_sha || github.sha }}
        run: |
          TAG=$(echo "$RELEASE_REPORT" | jq -r '.releases[] | select(.component=="engine") | .tag_name')
          gh api "repos/${{ github.repository }}/statuses/$GATE_SHA" -f state=success -f context=release/engine -f description="$TAG"
          echo "ready: $TAG at $GATE_SHA"

  publish:
    if: always() && !inputs.dry_run
    needs: [ready-engine]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish every built and tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-tested-releases.mjs

  # The lane's outcome, as issues. Every job above feeds this, so a build or
  # publish failure is filed instead of sitting on a red run nobody opened. A
  # dry run files nothing: its red job is the answer the operator asked for.
  report:
    needs:
      - build-engine
      - engine-checksums
      - build-engine-image
      - ready-engine
      - publish
    if: always() && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File failures and flakes as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never paste this into the command: a commit subject in a job
          # output can hold a quote, and the shell would read it as code.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/report-run-failures.sh ci-failure "Release build failed on main" "Its release stays a draft until this job passes."
