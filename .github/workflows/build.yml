name: Build

on:
  workflow_call:
    inputs:
      release_report:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_report:
        description: 'Release report JSON (from release-damnit or .act/release-report.json)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-engine:
    if: contains(fromJSON(inputs.release_report).components, 'engine')
    strategy:
      # A compile or signing failure on one platform must not cancel the
      # others. With the default fail-fast, the windows/amd64 job's failure
      # cancelled darwin-arm64, darwin-amd64, and linux-amd64 mid-upload and
      # skipped engine-checksums, so the release published with zero assets
      # while still being marked "latest" — breaking the README install
      # command for every platform, not just the one that failed. Partial
      # assets plus a red job is strictly recoverable; an empty release is not.
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            ext: ""
            runner: macos-14
          - goos: darwin
            goarch: arm64
            ext: ""
            runner: macos-14
          - goos: windows
            goarch: amd64
            ext: ".exe"
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: engine
        run: go test ./...

      - name: Build binary
        working-directory: engine
        env:
          # Darwin needs cgo for the Local Network warmup probe
          # (internal/network/lanwarmup_darwin.go); darwin jobs run on macOS
          # runners so the SDK is native. Other targets stay CGO-free static.
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "${ASSET}" ./cmd/ion/

      - name: Import signing certificate
        if: matrix.goos == 'darwin'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-$(date +%s)"

          echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_FILE"

      - name: Sign binary
        if: matrix.goos == 'darwin'
        working-directory: engine
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing with: $IDENTITY"
          # Namespaced identifier: macOS Local Network grants key to the code
          # identity; keep in sync with engine/commands/install.command and
          # desktop/scripts/afterPack.js.
          codesign --force --sign "$IDENTITY" --identifier house.sprague.ion.engine --options runtime "$ASSET"
          codesign --verify --verbose "$ASSET"

      - name: Notarize binary
        if: matrix.goos == 'darwin'
        working-directory: engine
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          # notarytool requires a zip, dmg, or pkg
          ZIP="${ASSET}.zip"
          zip "$ZIP" "$ASSET"

          # Write API key to file
          KEY_FILE=$(mktemp /tmp/apikey.XXXXXX.p8)
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE"

          xcrun notarytool submit "$ZIP" \
            --key "$KEY_FILE" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 10m

          rm -f "$KEY_FILE" "$ZIP"

      - name: Clean up keychain
        if: matrix.goos == 'darwin' && always()
        run: |
          security delete-keychain build.keychain-db 2>/dev/null || true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: engine
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          ASSET="ion-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          gh release upload "$TAG" "${ASSET}" --clobber

  engine-checksums:
    needs: build-engine
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          gh release download "$TAG" -R "${{ github.repository }}" -D assets/

      - name: Generate checksums
        run: |
          cd assets
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="engine-v${{ steps.version.outputs.version }}"
          gh release upload "$TAG" assets/checksums.txt --clobber -R "${{ github.repository }}"

  build-engine-image:
    if: contains(fromJSON(inputs.release_report).components, 'engine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="engine") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: engine
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/engine:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/engine:latest

  build-relay:
    if: contains(fromJSON(inputs.release_report).components, 'relay')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="relay") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: relay
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}/relay:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/relay:latest

  build-desktop:
    if: contains(fromJSON(inputs.release_report).components, 'desktop')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Get version
        id: version
        env:
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          VERSION=$(echo "${RELEASE_REPORT}" | jq -r '.releases[] | select(.component=="desktop") | .new_version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build engine for macOS universal
        working-directory: engine
        env:
          ION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # cgo required for the Local Network warmup probe
          # (internal/network/lanwarmup_darwin.go); this job runs on macOS so
          # cross-arch darwin cgo builds work natively.
          #
          # Stamp main.version so `ion version` reports the shipped release
          # instead of the "dev" default. This is observability, not a
          # correctness gate: the desktop swaps the daemon by binary hash
          # (engine-bootstrap.ts), not by this string. An unstamped binary
          # reports "dev" for every build, which is what made the stale-daemon
          # bug invisible in support logs.
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=${ION_VERSION}" -o ion-arm64 ./cmd/ion/
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=${ION_VERSION}" -o ion-amd64 ./cmd/ion/
          lipo -create -output ion ion-arm64 ion-amd64
          rm ion-arm64 ion-amd64
          file ion

      - name: Copy engine to desktop resources
        run: |
          mkdir -p desktop/resources/engine
          cp engine/ion desktop/resources/engine/ion

      - name: Bundle engine extensions and plist
        run: |
          # Copy the extension SDK into the resources tree so it is packaged
          # as extraResources alongside the engine binary. The plist template is
          # written by engine-bootstrap.ts at first launch after $HOME substitution.
          mkdir -p desktop/resources/engine/extensions
          cp -r engine/extensions/sdk desktop/resources/engine/extensions/sdk

          # Copy plist template; engine-bootstrap.ts substitutes $HOME at runtime.
          cp packaging/launchd/com.ion.engine.plist desktop/resources/engine/com.ion.engine.plist

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set desktop release version
        working-directory: desktop
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build app
        working-directory: desktop
        env:
          ION_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: npx electron-vite build --mode production

      - name: Import signing certificates
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          # Developer ID Application cert — signs the .app and .dmg (codesign).
          APP_CERT_FILE=$(mktemp /tmp/appcert.XXXXXX.p12)
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$APP_CERT_FILE"
          security import "$APP_CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$APP_CERT_FILE"

          # Developer ID Installer cert — signs the .pkg (productsign). This is a
          # DISTINCT cert type from the Application cert above. Optional: when the
          # secret is absent the .pkg is built unsigned and the packaging step
          # warns (it is not usable for MDM push until the secret is added).
          if [ -n "$APPLE_INSTALLER_CERT_BASE64" ]; then
            INST_CERT_FILE=$(mktemp /tmp/instcert.XXXXXX.p12)
            echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > "$INST_CERT_FILE"
            security import "$INST_CERT_FILE" -k "$KEYCHAIN" -P "$APPLE_INSTALLER_CERT_PASSWORD" \
              -T /usr/bin/productsign -T /usr/bin/security
            rm -f "$INST_CERT_FILE"
          else
            echo "APPLE_INSTALLER_CERT_BASE64 not set — .pkg will be built unsigned"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Extract the Application identity for electron-builder (name only) and
          # the Installer identity for productsign (full "Developer ID Installer:"
          # string). find-identity with no policy filter lists both.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/' | sed 's/^Developer ID Application: //')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APPLE_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package
        working-directory: desktop
        env:
          CI: "true"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-builder --mac --universal --publish never \
            -c.mac.identity="$APPLE_SIGNING_IDENTITY"

      - name: Build, sign, and notarize the enterprise .pkg
        working-directory: desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Wrap the signed + notarized Ion.app into a component .pkg for MDM
          # (Intune/Jamf) push. build-pkg.sh reads the version from package.json
          # and writes release/Ion-<version>.pkg.
          npm run pkg

          PKG=""
          for f in release/Ion-*.pkg; do
            [ -f "$f" ] && PKG="$f" && break
          done
          [ -n "$PKG" ] || { echo "ERROR: no .pkg produced by build-pkg.sh"; exit 1; }

          if [ -n "$APPLE_INSTALLER_IDENTITY" ]; then
            SIGNED="${PKG%.pkg}-signed.pkg"
            productsign --sign "$APPLE_INSTALLER_IDENTITY" "$PKG" "$SIGNED"
            mv -f "$SIGNED" "$PKG"
            echo "signed pkg with: $APPLE_INSTALLER_IDENTITY"

            # Notarize + staple the installer (reuses the app-notarization creds).
            # The enclosed .app is already notarized by the notarize.js afterSign
            # hook; this notarizes the installer wrapper itself.
            if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              KEYFILE=$(mktemp /tmp/apikey.XXXXXX.p8)
              echo "$APPLE_API_KEY" | base64 --decode > "$KEYFILE"
              xcrun notarytool submit "$PKG" --key "$KEYFILE" --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" --wait --timeout 15m
              xcrun stapler staple "$PKG"
              rm -f "$KEYFILE"
              echo "notarized + stapled: $PKG"
            else
              echo "APPLE_API_* not set — pkg signed but NOT notarized"
            fi
          else
            echo "APPLE_INSTALLER_IDENTITY not set — pkg is UNSIGNED (not usable for MDM push until APPLE_INSTALLER_CERT_BASE64 is added)"
          fi

          APP="release/mac-universal/Ion.app"
          [ -d "$APP" ] || { echo "ERROR: no universal Ion.app produced"; exit 1; }
          node scripts/check-release-version.js "${{ steps.version.outputs.version }}" "$APP" "$PKG"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop
        run: |
          TAG="desktop-v${{ steps.version.outputs.version }}"
          for f in release/*.dmg release/*.zip release/*.pkg release/latest-mac.yml; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber -R "${{ github.repository }}"
          done

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain build.keychain-db 2>/dev/null || true
