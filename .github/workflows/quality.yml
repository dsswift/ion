name: Quality

# The test lane. It runs beside the release build on every push to main and
# never in front of the push: the push lands, versions, and builds without
# waiting. Its verdict gates publishing instead: a built release stays a draft
# until the jobs that gate its component pass for that commit (GATES in
# .github/scripts/publish-tested-releases.mjs, run by publish.yml when this
# workflow completes). A failure is filed as an issue by the `report` job at
# the bottom. Every product job is scoped to the paths the push touched, on
# pull requests and on main alike, so a docs-only push runs no engine job;
# a job a push skips takes its verdict from the nearest earlier run of it.
# Scheduled and manual runs validate every scope.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A full run of every scope, so a regression a scoped push skipped still
    # surfaces within a day.
    - cron: '17 4 * * *'
  workflow_dispatch:

# A newer push to a pull request supersedes its unfinished run. A push to main
# is never cancelled: each one cuts releases that wait for this run's verdict
# on that exact commit, and the next push's run only tests what it touched.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  # dorny/paths-filter reads the pull request's file list through the API and,
  # on a push, diffs against the push's `before` commit. A scheduled or manual
  # run has no diff and validates every scope.
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine == 'true' || steps.all.outputs.all == 'true' }}
      sdk: ${{ steps.filter.outputs.sdk == 'true' || steps.all.outputs.all == 'true' }}
      logging: ${{ steps.filter.outputs.logging == 'true' || steps.all.outputs.all == 'true' }}
      dashboards: ${{ steps.filter.outputs.dashboards == 'true' || steps.all.outputs.all == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || steps.all.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: all
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.all.outputs.all != 'true'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: .github/quality-paths.yml

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
      - name: Test release summary context
        run: bash .github/scripts/build-release-summary-context.test.sh
      - name: Test the pipeline's issue and release scripts
        run: |
          bash .github/scripts/open-ci-issue.test.sh
          bash .github/scripts/report-run-failures.test.sh
          bash .github/scripts/hold-built-releases.test.sh
          bash .github/scripts/run-ion-prompt.test.sh
          bash .github/scripts/download-release-assets.test.sh
          node --test .github/scripts/publish-tested-releases.test.mjs

  go-toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Go toolchain alignment
        run: bash scripts/check-go-toolchains.sh
      - name: Test Go toolchain alignment check
        run: bash scripts/check-go-toolchains.test.sh
      - name: Test Linux parity gate receipt semantics
        run: bash scripts/gate-cache.test.sh
      - name: Test the main-moved check
        run: bash scripts/check-main-current.test.sh

  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file-size caps
        run: bash scripts/check-file-sizes.sh
      # A committed build artifact renders in review as "Bin 0 -> 33644032
      # bytes" and scrolls past. Catch it here rather than in a later cleanup.
      - name: Check no tracked binaries
        run: bash scripts/check-no-binaries.sh

  issue-closure:
    # PR-only: no PR exists on a plain push/schedule/dispatch run to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify referenced issues actually close on merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-issue-closure.sh "${{ github.event.pull_request.number }}"

  vocabulary:
    # Always runs: registry references can point at source in any product scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        # The vocabulary validator uses only Node built-ins, so no npm install is needed.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vocabulary registry and generated index
        run: make check-vocabulary

  check-logging:
    needs: changes
    if: needs.changes.outputs.logging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADR-019 logging standards
        # Enforces the logging standards from ADR-019: no interpolated msg
        # arguments and no non-canonical field keys. A failure here means a
        # new call site violates the standard — fix the call site, not the
        # script.
        run: bash scripts/check-logging.sh
      - name: RESERVED-KEY scanner test
        run: bash scripts/check-logging-reserved-keys.test.sh

  dashboards:
    needs: changes
    if: needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        # Node 22.6+ ships native TypeScript type-stripping, which the
        # dashboards generator/checker rely on (zero runtime deps, no
        # npm install). 24 is comfortably above the floor.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Dashboards drift + overcount audit
        # Regenerates every provisioned Grafana dashboard JSON and queries.md
        # from the canonical query module and byte-diffs against the committed
        # files; re-runs the range-accumulation-fixed-window structural audit
        # on emitted JSON. A failure here means someone hand-edited a committed
        # dashboard JSON or changed the query module without regenerating.
        # Fix: edit docs/observability/dashboards, run `npm run generate`,
        # commit both. See ADR-020.
        run: make check-dashboards
      - name: Dashboards generator tests
        working-directory: docs/observability/dashboards
        run: npm test

  engine-crossbuild:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Compile gate for every platform the release matrix ships
    # (.github/workflows/build.yml). No other job sets GOOS: engine-test runs
    # on ubuntu-latest and macos-14, and engine-lint runs host-native, so a
    # platform-specific compile error is invisible until the release workflow
    # runs after merge. That is how a syscall.SetsockoptInt call that
    # type-checks on Unix but not on Windows shipped — the windows/amd64
    # release job failed and, being a fail-fast matrix at the time, cancelled
    # the other three platforms and published engine releases with no assets.
    #
    # CGO_ENABLED=0 for every target, including darwin: the cgo-dependent
    # Local Network probe and FSEvents watcher are behind
    # `//go:build darwin && cgo` with constraint-complementary fallbacks
    # (internal/network/lanwarmup_other.go, internal/watcher/source_default.go),
    # so a CGO-free darwin cross-build exercises the real code path for this
    # purpose. This is a compile gate rather than a test job, so it is not
    # mirrored into `make test-linux`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Cross-build engine (${{ matrix.goos }}/${{ matrix.goarch }})
        working-directory: engine
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  engine-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    strategy:
      # Windows is a supported target, so its unit and integration suites gate
      # every engine PR alongside Linux and macOS. windows-latest bills at 2x
      # a Linux minute; that is the price of catching path-semantics, process-
      # tree and registry regressions before a release rather than after.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The extension host and
      # workspaces suites spawn many short-lived node.exe/git.exe/
      # powershell.exe subprocesses, and Defender's real-time scan of every
      # process launch is what dominates wall-clock on Windows for that
      # pattern. Ephemeral runner, no effect on what the tests verify.
      - name: Disable Windows Defender real-time scanning
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache: false
      # Go caches a passing test result with its inputs, so a package this
      # push did not touch is reported from cache in milliseconds. setup-go's
      # own cache saves only when go.sum changes, which would freeze the test
      # results at that moment; keying on the run id saves every run's
      # results, and the restore prefix picks up the newest.
      - name: Go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build and test cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('engine/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('engine/go.sum') }}-
            go-test-${{ runner.os }}-
      - name: Unit tests with race detector
        working-directory: engine
        run: go test -race ./...
      - name: Contract manifest up to date
        working-directory: engine
        run: go test ./internal/types/ -run TestContractManifest -v
      - name: SDK contract manifest up to date
        working-directory: engine
        run: go test ./internal/extension/ -run TestSDKContractManifest -v
      - name: Integration tests with race detector
        working-directory: engine
        run: go test -race -tags integration ./tests/integration/...

  engine-lint:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod

      # Full lint on every event. We previously ran
      # --new-from-merge-base=origin/main on PRs and full on push, but:
      #
      #  1. Differential mode does not speed up CI — golangci-lint still
      #     analyses the entire module; the flag only post-filters the
      #     report. In practice the two modes ran within ~1s of each
      #     other in this repo.
      #
      #  2. Differential mode let lint debt accumulate invisibly: a PR
      #     would land green, then the immediate push-to-main full run
      #     would surface dozens of pre-existing findings nobody had
      #     incentive to fix. That is exactly what happened to PR #131
      #     (44 errcheck/staticcheck/ineffassign findings, none in the
      #     PR's diff, all surfaced only on merge).
      #
      # Running full lint on PRs means the author may occasionally see
      # findings from elsewhere in the codebase. The cure is a small
      # cleanup commit, not hiding the findings. The module is small
      # enough that a full lint sweep is cheap.
      - name: golangci-lint engine
        if: needs.changes.outputs.engine == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: engine
      - name: golangci-lint sdk
        if: needs.changes.outputs.sdk == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: sdk/go

  sdk-test:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    # The Go SDK's parity tests read two generated goldens — the engine's SDK
    # contract manifest and the SDK's own surface manifest — so they run from a
    # full checkout rather than from the module in isolation. This is the job
    # that turns "a hook exists in one SDK and not the other" into a red build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
      - name: Unit and parity tests with race detector
        working-directory: sdk/go
        run: go test -race ./...

  # The TypeScript SDK ships as source; its tests live in a small vitest
  # project beside it and read the same goldens the Go SDK's parity tests do.
  sdk-ts-test:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/extensions/sdk/package-lock.json
      - name: Install
        working-directory: engine/extensions/sdk
        run: npm ci
      - name: Typecheck
        working-directory: engine/extensions/sdk
        run: npm run typecheck
      - name: Tests
        working-directory: engine/extensions/sdk
        run: npm test

  doc-links:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative markdown links resolve
        run: bash scripts/check-doc-links.sh

  docker-build:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: engine
          push: false
          platforms: linux/amd64
          tags: ion-engine:ci

  report:
    needs:
      - actionlint
      - go-toolchains
      - file-size
      - issue-closure
      - vocabulary
      - check-logging
      - dashboards
      - engine-crossbuild
      - engine-test
      - engine-lint
      - sdk-test
      - sdk-ts-test
      - doc-links
      - docker-build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File failures and flakes as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never paste this into the command: a commit subject in a job
          # output can hold a quote, and the shell would read it as code.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/report-run-failures.sh ci-failure "Tests failed on main" "The releases this job gates stay drafts until it passes; rerun it or fix forward."
