name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file-size caps
        run: bash scripts/check-file-sizes.sh

  status-writers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check status-writer chokepoints
        # Phase 4 of the state-management overhaul. Prohibits new direct
        # writes to tab.status / inst.statusFields outside the
        # dispatcher chokepoints whitelisted in the script. A failure
        # here is intentional — add your call site to the whitelist
        # only if you have reviewed and approved the engine-vs-client
        # state-ownership rule documented in CLAUDE.md.
        run: bash scripts/check-status-writers.sh

  atv-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Overlay-ATV broadcast parity
        # The overlay and ATV shell are two clients of one event stream:
        # pushes to the overlay renderer must route through broadcast()
        # (which fans out to the ATV mirror) unless the sending file is on
        # the owner-only allowlist in the script, each entry with a reason.
        run: bash scripts/check-atv-parity.sh

  check-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADR-019 logging standards
        # Enforces the logging standards from ADR-019: no interpolated msg
        # arguments, no console.* calls in the renderer process, no relay
        # slog package-level calls that bypass relayHandler, and no
        # non-canonical field keys. A failure here means a new call site
        # violates the standard — fix the call site, not the script.
        run: bash scripts/check-logging.sh

  check-swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: iOS silent-failure lint (SwiftLint)
        # Silent-failure gate for the iOS app, mirroring the "no silent
        # failures" goal of the observability pass and the desktop's
        # check-logging gate. Custom rules in ios/.swiftlint.yml flag empty
        # `catch {}` blocks (error — swallows the error) and silent `try?`
        # statements (warning). Only the empty-catch error fails the build;
        # the try? warnings are advisory, so we do NOT pass --strict (which
        # would escalate every warning to an error and fail on the 100+
        # legitimate try? sites this gate intentionally tolerates). Plain
        # `swiftlint lint` exits non-zero only on error-severity violations.
        #
        # Pinned to the same SwiftLint version used locally (0.65.0) via the
        # official GHCR image so the gate is deterministic and Linux-native
        # (no macos runner needed). The image's entrypoint is swiftlint; we
        # mount the checked-out workspace and lint the app source.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.0 \
            lint --config ios/.swiftlint.yml ios/IonRemote

  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        # Node 22.6+ ships native TypeScript type-stripping, which the
        # dashboards generator/checker rely on (zero runtime deps, no
        # npm install). 24 is comfortably above the floor.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Dashboards drift + overcount audit
        # Regenerates every provisioned Grafana dashboard JSON and queries.md
        # from the canonical query module and byte-diffs against the committed
        # files; re-runs the range-accumulation-fixed-window structural audit
        # on emitted JSON. A failure here means someone hand-edited a committed
        # dashboard JSON or changed the query module without regenerating.
        # Fix: edit docs/observability/dashboards, run `npm run generate`,
        # commit both. See ADR-020.
        run: make check-dashboards
      - name: Dashboards generator tests
        working-directory: docs/observability/dashboards
        run: npm test

  engine-crossbuild:
    # Compile gate for every platform the release matrix ships
    # (.github/workflows/build.yml). No other job sets GOOS: engine-test runs
    # on ubuntu-latest and macos-14, and engine-lint runs host-native, so a
    # platform-specific compile error is invisible until the release workflow
    # runs after merge. That is how a syscall.SetsockoptInt call that
    # type-checks on Unix but not on Windows shipped — the windows/amd64
    # release job failed and, being a fail-fast matrix at the time, cancelled
    # the other three platforms and published engine releases with no assets.
    #
    # CGO_ENABLED=0 for every target, including darwin: the cgo-dependent
    # Local Network probe is behind `//go:build darwin && cgo` with a
    # constraint-complementary fallback (internal/network/lanwarmup_other.go),
    # so a CGO-free darwin cross-build exercises the real code path for this
    # purpose. This is a compile gate rather than a test job, so it is not
    # mirrored into `make test-linux`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Cross-build engine (${{ matrix.goos }}/${{ matrix.goarch }})
        working-directory: engine
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  engine-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
      - name: Unit tests with race detector
        working-directory: engine
        run: go test -race ./...
      - name: Contract manifest up to date
        working-directory: engine
        run: go test ./internal/types/ -run TestContractManifest -v
      - name: SDK contract manifest up to date
        working-directory: engine
        run: go test ./internal/extension/ -run TestSDKContractManifest -v
      - name: Integration tests with race detector
        working-directory: engine
        run: go test -race -tags integration ./tests/integration/...

  engine-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod

      # Full lint on every event (PR and push). We previously ran
      # --new-from-merge-base=origin/main on PRs and full on push, but:
      #
      #  1. Differential mode does not speed up CI — golangci-lint still
      #     analyses the entire module; the flag only post-filters the
      #     report. In practice the two modes ran within ~1s of each
      #     other in this repo.
      #
      #  2. Differential mode let lint debt accumulate invisibly: a PR
      #     would land green, then the immediate push-to-main full run
      #     would surface dozens of pre-existing findings nobody had
      #     incentive to fix. That is exactly what happened to PR #131
      #     (44 errcheck/staticcheck/ineffassign findings, none in the
      #     PR's diff, all surfaced only on merge).
      #
      # Running full lint on PRs means the author may occasionally see
      # findings from elsewhere in the codebase. The cure is a small
      # cleanup commit, not hiding the findings. The module is small
      # enough that a full lint sweep is cheap.
      - name: golangci-lint engine
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: engine
      - name: golangci-lint relay
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: relay
      - name: golangci-lint sdk
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: sdk/go

  engine-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
      - name: govulncheck (engine)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: engine
      - name: govulncheck (relay)
        run: govulncheck ./...
        working-directory: relay
      - name: govulncheck (sdk)
        run: govulncheck ./...
        working-directory: sdk/go

  sdk-test:
    # The Go SDK's parity tests read two generated goldens — the engine's SDK
    # contract manifest and the SDK's own surface manifest — so they run from a
    # full checkout rather than from the module in isolation. This is the job
    # that turns "a hook exists in one SDK and not the other" into a red build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
      - name: Unit and parity tests with race detector
        working-directory: sdk/go
        run: go test -race ./...

  relay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
      - name: Unit tests with race detector
        working-directory: relay
        run: go test -race ./...

  desktop-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: desktop
        run: npm run typecheck
      - name: Run tests
        working-directory: desktop
        run: npm test

  desktop-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: ESLint
        # Enforces react-hooks/rules-of-hooks and react-hooks/exhaustive-deps
        # as errors in renderer/ — the primary structural gate against React
        # error #185 (infinite re-render loops). Also enforces no-console and
        # no-unstable-nested-components in renderer/. See desktop/eslint.config.mjs.
        working-directory: desktop
        run: npm run lint

  desktop-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit (high+ only, prod deps)
        working-directory: desktop
        run: npm audit --audit-level=high --omit=dev

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: engine
          push: false
          platforms: linux/amd64
          tags: ion-engine:ci

  ios-build:
    # macos-26 ships Xcode 26 / the iOS 26 SDK. The iOS app contains
    # ios/IonRemote/Services/ModernSpeechEngine.swift, which is gated
    # @available(iOS 26, *) and references iOS-26-only symbols
    # (SpeechAnalyzer, SpeechTranscriber, AnalyzerInput) at file scope.
    # Those symbols do not exist in the iOS 17-18 SDK that Xcode 16 (the
    # default on macos-15) ships, so building on macos-15 fails with
    # exit 65 even though every use site is gated. Xcode 26 is also
    # what our Xcode Cloud iOS job uses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test iOS app
        # `test` needs a simulator; `platform=iOS Simulator,OS=latest` lets
        # Xcode select an available device from the runner's newest runtime,
        # rather than pinning a device name or SDK version that could disappear.
        #
        # This runs the WHOLE IonRemoteTests suite, with no -only-testing
        # filter. An earlier revision of this job listed three classes
        # (ThemeParityTests, ThemeableSurfaceCoverageTests,
        # StatusCascadeParityTests) on the assumption that the full suite
        # would cost materially more wall-clock. Measured on an M4 against a
        # cold simulator, that assumption was false: the three-class filter
        # runs in 29s and the full suite in 62-64s across three consecutive
        # runs, all green. Roughly 34 extra seconds buys PR enforcement for
        # every test in the target instead of three classes, so the filter is
        # not worth its cost and there is no exclusion list.
        #
        # CODE_SIGNING_ALLOWED must stay YES. The app's entitlements declare
        # `keychain-access-groups` (ios/IonRemote/App/IonRemote.entitlements),
        # and CODE_SIGNING_ALLOWED=NO strips the entitlement from the test
        # host, so every SecItemAdd inside the simulator fails with a denied
        # keychain access. That is invisible under the old three-class filter
        # and fails OIDCTokenManagerTests.testKeychainComposedKey the moment
        # the suite is widened. CODE_SIGNING_REQUIRED=NO plus an ad-hoc
        # CODE_SIGN_IDENTITY keeps the runner from needing a provisioning
        # profile while preserving the simulated entitlement.
        working-directory: ios
        run: |
          xcodebuild \
            -project IonRemote.xcodeproj \
            -scheme IonRemote \
            -destination 'platform=iOS Simulator,OS=latest' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            test
