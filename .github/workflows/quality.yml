name: Quality

# The test lane. It runs beside the release build on every push to main and
# never in front of it: a failure here is filed as an issue by the `report`
# job at the bottom, and the release for that push ships regardless. Every
# product job is scoped to the paths the push touched, on pull requests and
# on main alike, so an iOS-only push runs no Windows job. Scheduled and
# manual runs validate every scope.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full simulator suite: catches broad behavioral regressions without making
    # every push wait for a cold macOS simulator.
    - cron: '17 4 * * *'
  workflow_dispatch:

# A newer push to the same branch supersedes an unfinished run; its report
# covers the newer commit. Scheduled and manual runs are never cancelled.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  # dorny/paths-filter reads the pull request's file list through the API and,
  # on a push, diffs against the push's `before` commit. A scheduled or manual
  # run has no diff and validates every scope.
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine == 'true' || steps.all.outputs.all == 'true' }}
      sdk: ${{ steps.filter.outputs.sdk == 'true' || steps.all.outputs.all == 'true' }}
      relay: ${{ steps.filter.outputs.relay == 'true' || steps.all.outputs.all == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' || steps.all.outputs.all == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.all.outputs.all == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' || steps.all.outputs.all == 'true' }}
      ios: ${{ steps.filter.outputs.ios == 'true' || steps.all.outputs.all == 'true' }}
      logging: ${{ steps.filter.outputs.logging == 'true' || steps.all.outputs.all == 'true' }}
      dashboards: ${{ steps.filter.outputs.dashboards == 'true' || steps.all.outputs.all == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || steps.all.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: all
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.all.outputs.all != 'true'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: .github/quality-paths.yml

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
      - name: Test release summary context
        run: bash .github/scripts/build-release-summary-context.test.sh
      - name: Test the pipeline's issue and release scripts
        run: |
          bash .github/scripts/open-ci-issue.test.sh
          bash .github/scripts/report-run-failures.test.sh
          bash .github/scripts/hold-built-releases.test.sh

  go-toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Go toolchain alignment
        run: bash scripts/check-go-toolchains.sh
      - name: Test Go toolchain alignment check
        run: bash scripts/check-go-toolchains.test.sh
      - name: Test Linux parity gate receipt semantics
        run: bash scripts/gate-cache.test.sh
      - name: Test Linux parity gate node_modules isolation
        run: bash scripts/test-linux-gate-mounts.test.sh
      - name: Test the root prepare script without husky
        run: bash scripts/husky-install.test.sh
      - name: Test the main merge-node rule
        run: bash scripts/check-main-merge-node.test.sh
      - name: Test make land and the main-moved check
        run: bash scripts/land.test.sh
      - name: Studio server installer test
        run: bash scripts/install-studio-server.test.sh

  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file-size caps
        run: bash scripts/check-file-sizes.sh
      # A committed build artifact renders in review as "Bin 0 -> 33644032
      # bytes" and scrolls past. Catch it here rather than in a later cleanup.
      - name: Check no tracked binaries
        run: bash scripts/check-no-binaries.sh

  issue-closure:
    # PR-only: no PR exists on a plain push/schedule/dispatch run to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify referenced issues actually close on merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-issue-closure.sh "${{ github.event.pull_request.number }}"

  # Windows Group Policy template drift. Always runs: the template's registry
  # contract is asserted against docs/enterprise/mdm.md, so a docs-only edit
  # that drops a documented value name is exactly the change this catches.
  admx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADMX/ADML and registry-contract drift
        run: make check-admx

  # The Windows entry points a Windows contributor runs first. Always runs: a
  # PowerShell syntax error is otherwise only found when the script executes, on
  # a machine nobody here is watching. The ubuntu runner ships pwsh.
  windows-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell entry points parse and behave
        run: make check-windows-scripts

  # The same helper tests under Windows PowerShell 5.1, which is what an SSH
  # session and a plain Start-Menu PowerShell give you on Windows 11. Its
  # error semantics differ from pwsh 7 in ways that have already broken a
  # build: 5.1 turns a native command's stderr into a terminating error, so a
  # `go: downloading ...` progress line failed the whole run. Only this leg
  # tells the two apart.
  windows-scripts-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: IonBuild helpers under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\IonBuild.test.ps1
      - name: IonBuild helpers under PowerShell 7
        shell: pwsh
        run: .\scripts\windows\IonBuild.test.ps1

  vocabulary:
    # Always runs: registry references can point at source in any product scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        # The vocabulary validator uses only Node built-ins, so no npm install is needed.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vocabulary registry and generated index
        run: make check-vocabulary

  status-writers:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check status-writer chokepoints
        # Phase 4 of the state-management overhaul. Prohibits new direct
        # writes to tab.status / inst.statusFields outside the
        # dispatcher chokepoints whitelisted in the script. A failure
        # here is intentional — add your call site to the whitelist
        # only if you have reviewed and approved the engine-vs-client
        # state-ownership rule documented in CLAUDE.md.
        run: bash scripts/check-status-writers.sh

  server-parity:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Server parity (spec 17)
        # Server owns the store, Studio renders: a direct webContents.send
        # from Electron main is suspect unless the sending file is on the
        # main-process-only allowlist in the script, each entry with a
        # reason. Also gates the executeJavaScript elimination, the deleted
        # single-UI exclusivity keys, and imports of deleted paths.
        run: bash scripts/check-server-parity.sh

  studio-wire:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script diffs against the PR base branch to detect a changed
          # fixture; the default shallow (fetch-depth 1) checkout has no
          # history to diff against.
          fetch-depth: 0
      - name: Studio wire protocol version gate
        # A changed or newly-added golden fixture under
        # packages/shared/src/studio-wire/__fixtures__ must ship with a
        # matching '## v<N>' note in docs/protocol/studio-wire.md in the
        # same PR -- the wire shape moved, and that is either a new
        # protocol version or a documented note under the current one.
        run: bash scripts/check-studio-wire.sh
        env:
          STUDIO_WIRE_BASE_REF: origin/${{ github.base_ref || 'main' }}

  check-logging:
    needs: changes
    if: needs.changes.outputs.logging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADR-019 logging standards
        # Enforces the logging standards from ADR-019: no interpolated msg
        # arguments, no console.* calls in the renderer process, no relay
        # slog package-level calls that bypass relayHandler, and no
        # non-canonical field keys. A failure here means a new call site
        # violates the standard — fix the call site, not the script.
        run: bash scripts/check-logging.sh
      - name: RESERVED-KEY scanner test
        run: bash scripts/check-logging-reserved-keys.test.sh

  check-swiftlint:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: iOS silent-failure lint (SwiftLint)
        # Silent-failure gate for the iOS app, mirroring the "no silent
        # failures" goal of the observability pass and the desktop's
        # check-logging gate. Custom rules in ios/.swiftlint.yml flag empty
        # `catch {}` blocks (error — swallows the error) and silent `try?`
        # statements (warning). Only the empty-catch error fails the build;
        # the try? warnings are advisory, so we do NOT pass --strict (which
        # would escalate every warning to an error and fail on the 100+
        # legitimate try? sites this gate intentionally tolerates). Plain
        # `swiftlint lint` exits non-zero only on error-severity violations.
        #
        # Pinned to the same SwiftLint version used locally (0.65.0) via the
        # official GHCR image so the gate is deterministic and Linux-native
        # (no macos runner needed). The image's entrypoint is swiftlint; we
        # mount the checked-out workspace and lint the app source.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.0 \
            lint --config ios/.swiftlint.yml ios/IonRemote

  dashboards:
    needs: changes
    if: needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        # Node 22.6+ ships native TypeScript type-stripping, which the
        # dashboards generator/checker rely on (zero runtime deps, no
        # npm install). 24 is comfortably above the floor.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Dashboards drift + overcount audit
        # Regenerates every provisioned Grafana dashboard JSON and queries.md
        # from the canonical query module and byte-diffs against the committed
        # files; re-runs the range-accumulation-fixed-window structural audit
        # on emitted JSON. A failure here means someone hand-edited a committed
        # dashboard JSON or changed the query module without regenerating.
        # Fix: edit docs/observability/dashboards, run `npm run generate`,
        # commit both. See ADR-020.
        run: make check-dashboards
      - name: Dashboards generator tests
        working-directory: docs/observability/dashboards
        run: npm test

  engine-crossbuild:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Compile gate for every platform the release matrix ships
    # (.github/workflows/build.yml). No other job sets GOOS: engine-test runs
    # on ubuntu-latest and macos-14, and engine-lint runs host-native, so a
    # platform-specific compile error is invisible until the release workflow
    # runs after merge. That is how a syscall.SetsockoptInt call that
    # type-checks on Unix but not on Windows shipped — the windows/amd64
    # release job failed and, being a fail-fast matrix at the time, cancelled
    # the other three platforms and published engine releases with no assets.
    #
    # CGO_ENABLED=0 for every target, including darwin: the cgo-dependent
    # Local Network probe is behind `//go:build darwin && cgo` with a
    # constraint-complementary fallback (internal/network/lanwarmup_other.go),
    # so a CGO-free darwin cross-build exercises the real code path for this
    # purpose. This is a compile gate rather than a test job, so it is not
    # mirrored into `make test-linux`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Cross-build engine (${{ matrix.goos }}/${{ matrix.goarch }})
        working-directory: engine
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  engine-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    strategy:
      # Windows is a supported target, so its unit and integration suites gate
      # every engine PR alongside Linux and macOS. windows-latest bills at 2x
      # a Linux minute; that is the price of catching path-semantics, process-
      # tree and registry regressions before a release rather than after.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Same rationale as desktop-test-windows: the extension host and
      # workspaces suites spawn many short-lived node.exe/git.exe/
      # powershell.exe subprocesses, and Defender's real-time scan of every
      # process launch is what dominates wall-clock on Windows for that
      # pattern. Ephemeral runner, no effect on what the tests verify.
      - name: Disable Windows Defender real-time scanning
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache: false
      # Go caches a passing test result with its inputs, so a package this
      # push did not touch is reported from cache in milliseconds. setup-go's
      # own cache saves only when go.sum changes, which would freeze the test
      # results at that moment; keying on the run id saves every run's
      # results, and the restore prefix picks up the newest.
      - name: Go cache paths
        id: gocache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build and test cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('engine/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('engine/go.sum') }}-
            go-test-${{ runner.os }}-
      - name: Unit tests with race detector
        working-directory: engine
        run: go test -race ./...
      - name: Contract manifest up to date
        working-directory: engine
        run: go test ./internal/types/ -run TestContractManifest -v
      - name: SDK contract manifest up to date
        working-directory: engine
        run: go test ./internal/extension/ -run TestSDKContractManifest -v
      - name: Integration tests with race detector
        working-directory: engine
        run: go test -race -tags integration ./tests/integration/...

  engine-lint:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.relay == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod

      # Full lint on every event. We previously ran
      # --new-from-merge-base=origin/main on PRs and full on push, but:
      #
      #  1. Differential mode does not speed up CI — golangci-lint still
      #     analyses the entire module; the flag only post-filters the
      #     report. In practice the two modes ran within ~1s of each
      #     other in this repo.
      #
      #  2. Differential mode let lint debt accumulate invisibly: a PR
      #     would land green, then the immediate push-to-main full run
      #     would surface dozens of pre-existing findings nobody had
      #     incentive to fix. That is exactly what happened to PR #131
      #     (44 errcheck/staticcheck/ineffassign findings, none in the
      #     PR's diff, all surfaced only on merge).
      #
      # Running full lint on PRs means the author may occasionally see
      # findings from elsewhere in the codebase. The cure is a small
      # cleanup commit, not hiding the findings. The module is small
      # enough that a full lint sweep is cheap.
      - name: golangci-lint engine
        if: needs.changes.outputs.engine == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: engine
      - name: golangci-lint relay
        if: needs.changes.outputs.relay == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: relay
      - name: golangci-lint sdk
        if: needs.changes.outputs.sdk == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          working-directory: sdk/go

  sdk-test:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    # The Go SDK's parity tests read two generated goldens — the engine's SDK
    # contract manifest and the SDK's own surface manifest — so they run from a
    # full checkout rather than from the module in isolation. This is the job
    # that turns "a hook exists in one SDK and not the other" into a red build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
      - name: Unit and parity tests with race detector
        working-directory: sdk/go
        run: go test -race ./...
      # The Studio SDK's Go flavor is its own module (Studio vocabulary stays out
      # of the engine SDK). Its contract test reads packages/studio-sdk/contract.json.
      - name: Studio SDK (Go) tests with race detector
        working-directory: packages/studio-sdk/go
        run: go test -race ./...

  relay-test:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
      - name: Unit tests with race detector
        working-directory: relay
        run: go test -race ./...

  desktop-test:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: desktop
        run: npm run typecheck
      - name: Run tests
        working-directory: desktop
        run: npm test

  # Desktop unit tests on a native Windows host. The suite carries win32-pinned
  # arms (path delimiter, modifier keys, engine address, scheduled-task
  # supervisor, machine identity, install dispatch) whose production behaviour
  # only exists on Windows; running them on Linux alone proves the mock, not
  # the platform. windows-latest bills at 2x a Linux minute, and this job is
  # gated on desktop changes so it does not run on every PR.
  desktop-test-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # This suite's git/worktree/bench fixtures spawn thousands of short-lived
      # git.exe/node.exe/powershell.exe subprocesses. Windows Defender's
      # real-time protection intercepts and scans every new process launch by
      # default, and that per-launch scan cost is what dominates wall-clock on
      # a subprocess-spawn-heavy suite -- npm test alone is ~95% of this job's
      # 14+ minutes. Disabling it is a pure CI-environment tweak (the runner is
      # ephemeral and destroyed after the job) with no effect on what the
      # tests verify.
      - name: Disable Windows Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: desktop
        run: npm run typecheck
      - name: Run tests
        working-directory: desktop
        run: npm test

  desktop-lint:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: ESLint
        # Enforces react-hooks/rules-of-hooks and react-hooks/exhaustive-deps
        # as errors in renderer/ — the primary structural gate against React
        # error #185 (infinite re-render loops). Also enforces no-console and
        # no-unstable-nested-components in renderer/. See desktop/eslint.config.mjs.
        working-directory: desktop
        run: npm run lint

  # Bundle the Studio renderer for Electron and for the browser. Both bundle
  # the server's session store and packages/shared, and a Node-only import
  # that reaches them fails only at bundle time: typecheck, lint, and every
  # unit test pass. So a server or shared change runs this too, not only a
  # desktop one.
  desktop-build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build (Electron)
        working-directory: desktop
        run: npm run build
      - name: Build (browser)
        working-directory: desktop
        run: npm run build:web

  # @ion/shared's only consumers are desktop and server, all three workspace
  # members, so its gate installs once at the workspace root and runs its
  # typecheck and test scripts by workspace name.
  shared-test:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm -w @ion/shared run typecheck
      - name: Run tests
        run: npm -w @ion/shared test -- --run

  server-typecheck:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm -w server run typecheck

  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: ESLint
        run: npm -w server run lint

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm -w server test -- --run

  doc-links:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative markdown links resolve
        run: bash scripts/check-doc-links.sh

  docker-build:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: engine
          push: false
          platforms: linux/amd64
          tags: ion-engine:ci

  # Real compose stack (manifest child 11): engine + server sharing one /data
  # volume, proven against an actual `docker compose up`, not a mock. Gated
  # on server OR engine changes -- a server.Dockerfile-only PR and an
  # engine.Dockerfile-only PR both need this to catch a compose-level
  # regression (the child 11 postmortem: engine/Dockerfile's unversioned
  # `go build` made every engine image report an unparseable "dev" version,
  # which made the compose stack's /readyz permanently refuse -- a failure
  # only a real `docker compose up` + `/readyz` poll catches, not a unit test
  # on either side alone).
  server-compose-smoke:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (smoke.mjs needs jose + ws)
        run: npm ci --ignore-scripts
      - name: docker compose up
        working-directory: server
        run: docker compose up -d --build
      - name: Wait for /readyz (up to 60s)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:7331/readyz || true)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::server never reached /readyz 200 within 60s"
          docker compose -f server/docker-compose.yml logs
          exit 1
      # Nonfunctional requirement: image size logged, gate fails above 400MB.
      # The server image (not the engine's, which is a separate FROM-scratch
      # binary an order of magnitude smaller) is the one this child's
      # multi-stage build + `npm prune --omit=dev` step controls.
      - name: Check server image size (<400MB)
        run: |
          SIZE_BYTES=$(docker image inspect server-server:latest --format '{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "server image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 400 ]; then
            echo "::error::server image is ${SIZE_MB}MB, over the 400MB gate"
            exit 1
          fi
      - name: Run smoke checks
        run: node server/scripts/smoke.mjs
      - name: docker compose down
        if: always()
        working-directory: server
        run: docker compose down -v

  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Required PR gate. Device-target compilation catches Swift, link, and
    # packaging errors without hosted simulator startup. The full XCTest suite
    # runs locally before push, plus nightly/manual in ios-full-test.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build iOS app
        run: make ios-pr-check

  ios-full-test:
    # Simulator startup and the entire XCTest bundle take about fifteen hosted
    # macOS minutes. Run on schedule or explicit dispatch, not every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test full iOS app
        env:
          IOS_TEST_BUILD_SETTINGS: CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
        run: bash scripts/run-ios-tests.sh

  # The lane's outcome, as issues. Every product job feeds this so a failure
  # anywhere above is filed; the run's own colour is not what the operator
  # watches. Pull requests get their checks inline and file nothing.
  report:
    needs:
      - actionlint
      - go-toolchains
      - file-size
      - admx
      - windows-scripts
      - windows-scripts-ps51
      - vocabulary
      - status-writers
      - server-parity
      - studio-wire
      - check-logging
      - check-swiftlint
      - dashboards
      - engine-crossbuild
      - engine-test
      - engine-lint
      - sdk-test
      - relay-test
      - desktop-test
      - desktop-test-windows
      - desktop-lint
      - desktop-build
      - shared-test
      - server-typecheck
      - server-lint
      - server-test
      - doc-links
      - docker-build
      - server-compose-smoke
      - ios-build
      - ios-full-test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File failures and flakes as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/report-run-failures.sh ci-failure "Tests failed on main" '${{ toJSON(needs) }}'
