name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'desktop/**'
      - 'relay/**'
      - 'ios/**'
      - 'sdk/**'
      # `server` is its own release unit -- release-please-config.json gives it
      # a component, a CHANGELOG and a VERSION, .commit.json scopes `server/`
      # to it, and build.yml's build-server job is gated only on the release
      # report listing it. It was missing here, which meant a server-only
      # change produced no release, so no release report, so no image: the one
      # component that can build entirely on its own was the one that could
      # never trigger its own build.
      - 'server/**'
      # `packages/` is a workspace member that the server image (server's
      # Dockerfile COPYs it) and the browser Studio client both build against.
      # A change confined to it alters both shipped artifacts and, before this,
      # released neither.
      - 'packages/**'
      - 'release-please-*.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  issues: write

# Two pushes in quick succession must not race: the second run's version
# computation has to see the first run's version-bump commit, or both bump
# the same component to the same version. Runs queue; none are cancelled,
# so every push still gets its release.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || 'false' }}
      release_report: ${{ steps.release.outputs.release_report || '{"releases":[],"components":[],"summary":{"total_releases":0,"total_commits":0,"by_bump_type":{"major":0,"minor":0,"patch":0}}}' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check if should skip
        id: check-skip
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${COMMIT_MSG}" == *"[skip ci]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: commit message contains [skip ci]"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-damnit
        id: release
        if: steps.check-skip.outputs.skip == 'false'
        uses: dsswift/release-damnit@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ inputs.dry_run || 'false' }}
          create-releases: 'true'

      - name: Commit version updates
        if: steps.check-skip.outputs.skip == 'false' && steps.release.outputs.releases_created == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add '*/VERSION' '*/CHANGELOG.md' 'release-please-manifest.json'

          if ! git diff --staged --quiet; then
            git commit -m "chore: release versions [skip ci]"
            git push
          fi

      # release-damnit publishes each release the moment it creates it, before
      # a single binary exists. Held as a draft here, a release is invisible
      # to the desktop's update feed, the README install link, and `latest`
      # until its own build.yml publish job has attached every asset. A build
      # that fails leaves a draft with a rerun button, never a published
      # release with files missing. Components with no build job (ios, sdk)
      # have nothing to wait for and publish now.
      - name: Hold built releases as drafts, publish the rest
        if: steps.check-skip.outputs.skip == 'false' && steps.release.outputs.releases_created == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPORT: ${{ steps.release.outputs.release_report }}
        run: bash .github/scripts/hold-built-releases.sh

  build:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_report: ${{ needs.release.outputs.release_report }}
    secrets: inherit

  # The summary names every release in the report, so it goes out only once
  # every publish job has succeeded; a partial build is rerun first (its
  # draft is waiting), and the summary follows that rerun.
  notify:
    needs: [release, build]
    if: needs.release.outputs.releases_created == 'true' && needs.build.result == 'success'
    uses: ./.github/workflows/release-summary.yml
    with:
      release_report: ${{ needs.release.outputs.release_report }}
    secrets: inherit

  # The jobs of this file, as issues. The build jobs file their own from
  # inside build.yml, by name; listing `build` here would file the same
  # failure a second time under a title that says less.
  report:
    needs: [release, notify]
    if: always() && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File failures and flakes as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never paste this into the command: a commit subject in a job
          # output can hold a quote, and the shell would read it as code.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/report-run-failures.sh ci-failure "Release failed on main" "The release for this push did not finish."
