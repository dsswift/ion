name: Security

# Dependency advisories and vulnerability scans read a feed that changes every
# day, so their result is not a property of the commit. They run here, off
# the ship path: nightly and on demand, never on a push to main, never in
# front of a release. A finding is filed as an issue (label: security) for
# the operator to fix in its own change.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  engine-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (engine)
        run: govulncheck ./...
        working-directory: engine
      - name: govulncheck (sdk)
        if: always()
        run: govulncheck ./...
        working-directory: sdk/go

  sdk-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit (high+ only)
        # The TypeScript SDK's test project is the only npm dependency tree
        # left in the repository; it is dev-only, so nothing is omitted.
        working-directory: engine/extensions/sdk
        run: npm audit --audit-level=high

  report:
    needs: [engine-vuln, sdk-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File findings as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never paste this into the command: a commit subject in a job
          # output can hold a quote, and the shell would read it as code.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/report-run-failures.sh security "Security scan failed"
