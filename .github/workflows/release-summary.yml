name: Release Summary

# Dispatched by publish-tested-releases.mjs once every release a push cut is
# public, with the Release run that saved the push's report. A manual re-send
# passes either that run id or the report itself.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Release workflow run whose release-report artifact to announce'
        required: false
        type: string
        default: ''
      release_report:
        description: 'Release report JSON (paste from a prior release run for manual re-send)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Load the release report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_REPORT: ${{ inputs.release_report }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_RUN_ID" ]; then
            gh run download "$RELEASE_RUN_ID" -n release-report -D /tmp/release-report -R "${{ github.repository }}"
            cp /tmp/release-report/release-report.json /tmp/release-report.json
            echo "report from Release run $RELEASE_RUN_ID"
          elif [ -n "$RELEASE_REPORT" ]; then
            printf '%s' "$RELEASE_REPORT" > /tmp/release-report.json
            echo "report from the release_report input"
          else
            echo "::error::pass release_run_id or release_report"
            exit 1
          fi
          jq -e '.releases' /tmp/release-report.json > /dev/null
          {
            echo 'RELEASE_REPORT<<RELEASE_REPORT_EOF'
            cat /tmp/release-report.json
            echo
            echo 'RELEASE_REPORT_EOF'
          } >> "$GITHUB_ENV"

      - name: Select engine image tag
        id: engine-image
        run: |
          set -euo pipefail
          ENGINE_VERSION=$(echo "$RELEASE_REPORT" | jq -r '
            .releases[]
            | select(.component == "engine")
            | .new_version
          ' | head -1)
          echo "tag=${ENGINE_VERSION:-latest}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull ion engine image
        run: docker pull ghcr.io/${{ github.repository }}/engine:${{ steps.engine-image.outputs.tag }}

      - name: Build release context document
        run: |
          set -euo pipefail
          bash .github/scripts/build-release-summary-context.sh /tmp/ion-context.md
          echo "Context document size: $(wc -c < /tmp/ion-context.md) bytes"

      - name: Compose final prompt
        env:
          ION_SYSTEM_PROMPT__STAKEHOLDER_RELEASE_NOTIFICATION: ${{ secrets.ION_SYSTEM_PROMPT__STAKEHOLDER_RELEASE_NOTIFICATION }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$ION_SYSTEM_PROMPT__STAKEHOLDER_RELEASE_NOTIFICATION"
            printf '## Release context\n\n'
            cat /tmp/ion-context.md
            printf '\n## Task\n\nWrite the Discord message now. Output only the message body, no preamble, no meta-commentary.\n'
          } > /tmp/ion-prompt.txt
          echo "Prompt size: $(wc -c < /tmp/ion-prompt.txt) bytes"

      # Ships this run's engine logs, telemetry, and spans to ion-telemetry,
      # signed in as the "Ion Headless Telemetry" app. The collector endpoint
      # comes from a secret so it is not committed.
      - name: Generate summary with ion
        env:
          ION_ENGINE_CONFIG_B64: ${{ secrets.ION_ENGINE_CONFIG_B64 }}
          ION_TELEMETRY_ENDPOINT: ${{ secrets.ION_TELEMETRY_ENDPOINT }}
          ION_TELEMETRY_SHIP_CLIENT_SECRET: ${{ secrets.ION_TELEMETRY_SHIP_CLIENT_SECRET }}
          ION_PROMPT_HOSTNAME: github-actions-release-summary
        run: |
          set -euo pipefail
          : "${ION_TELEMETRY_ENDPOINT:?ION_TELEMETRY_ENDPOINT secret is not set}"
          bash .github/scripts/run-ion-prompt.sh \
            ghcr.io/${{ github.repository }}/engine:${{ steps.engine-image.outputs.tag }} \
            /tmp/ion-prompt.txt /tmp/summary.md

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          chmod +x .github/scripts/post-to-discord.sh
          .github/scripts/post-to-discord.sh /tmp/summary.md "$DISCORD_WEBHOOK_URL" "Ion release"
